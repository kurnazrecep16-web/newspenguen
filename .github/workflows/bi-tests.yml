name: Brand Intelligence testleri

on:
  push:
    paths: ["supabase/**", "tests/bi/**", "scripts/bi-*", ".github/workflows/bi-tests.yml"]
  pull_request:
    paths: ["supabase/**", "tests/bi/**", "scripts/bi-*", ".github/workflows/bi-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Seed SQL güncel mi
        run: node scripts/bi-seed-sql.mjs && git diff --exit-code supabase/seed/brands.sql
      - name: Motor testleri
        run: node --test tests/bi/*.test.ts
      - name: Veritabanı testleri (migration, RLS, geri alma)
        run: bash scripts/bi-db-test.sh
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Edge function tip kontrolü
        working-directory: supabase
        run: echo '{"nodeModulesDir":"auto"}' > deno.json && deno check functions/brand-scan/index.ts
