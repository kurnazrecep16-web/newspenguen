<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<title>NEWSPENGUEN Haber Akışı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS (4px scale) ================= */
:root{
  --navy:#0F2A4A;--navy-2:#14365E;--navy-3:#1C4677;--blue:#2563EB;--blue-soft:#E8F0FE;--cream:#F4EFE6;--orange:#F59E0B;--green:#65A30D;
  --bg:#F3F6FA;--surface:#FFFFFF;--surface-2:#F1F4F8;--text:#0F1E33;--text-2:#36465A;--muted:#6B7A90;--border:#E3E9F0;
  --success:#16A34A;--warning:#D97706;--error:#DC2626;
  --seg-deco:#EA6A2A;--seg-marine:#0EA5E9;--seg-prot:#65A30D;--seg-powder:#8B5CF6;--seg-corp:#64748B;--seg-region:#F59E0B;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --sh-1:0 1px 2px rgba(15,30,51,.06),0 1px 3px rgba(15,30,51,.04);
  --sh-2:0 6px 24px rgba(15,30,51,.08);
  --sh-3:0 16px 40px rgba(15,30,51,.18);
  --focus:0 0 0 3px rgba(37,99,235,.35);
  --sidebar-w:248px;--rs:1;
}
[data-theme="dark"]{
  --bg:#0A1424;--surface:#101D31;--surface-2:#16263E;--text:#E7EEF7;--text-2:#C0CCDB;--muted:#8A9AB0;--border:#1F3150;
  --blue:#5B9BFF;--blue-soft:rgba(91,155,255,.14);--navy:#0B1C33;--navy-2:#11284A;
  --sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 6px 24px rgba(0,0,0,.35);--sh-3:0 16px 40px rgba(0,0,0,.55);--focus:0 0 0 3px rgba(91,155,255,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.icon{width:18px;height:18px;flex:0 0 auto}

/* ================= SIDEBAR (dark navy) ================= */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,#0F2A4A 0%,#0C2240 100%);color:#DCE6F2;display:flex;flex-direction:column;z-index:30;overflow:hidden}
.sb-scroll{flex:1;overflow-y:auto;padding:20px 14px 12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;color:#fff}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b3d91,#071f4d);display:grid;place-items:center;font-size:19px;box-shadow:0 1px 2px rgba(0,0,0,.25);flex:0 0 auto}
.brand-name{font-weight:800;letter-spacing:.4px;font-size:17px;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;border:none;background:none;color:#C9D6E6;font-size:14px;font-weight:500;width:100%;text-align:left}
.nv:hover{background:rgba(255,255,255,.07);color:#fff}
.nv[aria-current="page"]{background:var(--navy-3);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nv .chev{margin-left:auto;transition:transform .2s}
.nv[aria-expanded="false"] .chev{transform:rotate(180deg)}
.sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 0}
.sub.closed{display:none}
.sv{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px 0 42px;border-radius:8px;border:none;background:none;color:#B7C6D8;font-size:13.5px;width:100%;text-align:left}
.sv:hover{background:rgba(255,255,255,.06);color:#fff}
.sv[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08);font-weight:600}
.sv .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.sv .n{margin-left:auto;font-size:12px;color:#8FA3BC;font-weight:600}
.sb-sep{height:1px;background:rgba(255,255,255,.1);margin:12px 8px}
.mountain{position:absolute;left:0;right:0;bottom:0;height:170px;pointer-events:none;z-index:0}

/* ================= TOP BAR ================= */
.app{margin-left:var(--sidebar-w);min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tb{display:flex;align-items:center;gap:16px;padding:16px 28px 10px;max-width:1440px}
.greet h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.greet p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.m-head{display:none}
.searchbox{position:relative;flex:1;max-width:440px;margin-left:auto}
.searchbox input{width:100%;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 64px 0 44px;font-size:14px;box-shadow:var(--sh-1)}
.searchbox input:focus{outline:none;box-shadow:var(--focus);border-color:var(--blue)}
.searchbox .si{position:absolute;left:16px;top:13px;color:var(--muted)}
.kbd{position:absolute;right:14px;top:12px;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.suggest{position:absolute;top:52px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:8px;display:none;z-index:50;max-height:70vh;overflow:auto}
.suggest.open{display:block}
.suggest h6{margin:8px 8px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:9px 8px;border-radius:8px;font-size:14px}
.sg:hover,.sg.active{background:var(--surface-2)}
.sg small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.tbtn{height:44px;min-width:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;font-weight:600;position:relative;box-shadow:var(--sh-1)}
.tbtn:hover{background:var(--surface-2)}
.tbtn.round{padding:0;width:44px}
.bell-dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--error);border:2px solid var(--surface)}
.avatar-btn{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
[data-theme="dark"] .avatar{background:var(--navy-3)}
.pop{position:absolute;top:54px;right:0;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:8px;display:none;z-index:50}
.pop.open{display:block}
.pop h6{margin:6px 8px 6px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pop .item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;background:none;padding:8px;border-radius:8px;font-size:13.5px}
.pop .item:hover{background:var(--surface-2)}
.pop .item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rel{position:relative}
.linkbtn{border:none;background:none;color:var(--blue);font-size:12.5px;font-weight:600;padding:2px 4px;display:inline-flex;align-items:center;gap:4px}
.linkbtn:hover{text-decoration:underline}

/* chips */
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 28px 14px;max-width:1440px}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--text-2);box-shadow:var(--sh-1)}
.chip:hover{border-color:var(--navy-3);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#06101f}

.segrow{padding-top:0;margin-top:-4px;gap:6px}
.chip.tab{display:inline-flex;align-items:center;gap:8px;height:40px;font-size:14px}
.chip.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.tab svg{width:16px;height:16px}
.chip.tab[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.tab[aria-pressed="true"] .dot{background:#fff}
.chip.tab[aria-pressed="true"] .cn{color:rgba(255,255,255,.85)}
.sb-h{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(220,230,242,.6);padding:6px 12px 4px}
.sub .tabsv{font-size:14.5px;height:40px}
.schip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:transparent;font-size:13px;font-weight:600;color:var(--text-2)}
.schip:hover{background:var(--surface);border-color:var(--border)}
.schip[aria-pressed="true"]{background:var(--surface);border-color:var(--c,var(--navy));color:var(--text);box-shadow:var(--sh-1)}
.schip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .cn,.schip .cn{font-size:11.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"] .cn{color:rgba(255,255,255,.75)}
/* ================= LAYOUT ================= */
.wrap{padding:6px 28px 48px;max-width:1440px}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col-side{display:flex;flex-direction:column;gap:20px;position:sticky;top:128px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.panel-h h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.htag{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2)}
.htag:hover{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.htag.hot{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.mini{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border);width:100%;text-align:left;background:none;border-left:none;border-right:none;border-bottom:none}
.mini:first-of-type{border-top:none;padding-top:0}
.mini .scene{aspect-ratio:16/10;border-radius:10px}
.mini b{display:block;font-size:13.5px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.mini:hover b{color:var(--blue)}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
.sec-h h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:4px;height:22px;border-radius:2px;background:var(--blue)}

/* ================= SCENES (generated illustrations) ================= */
.scene{position:relative;overflow:hidden;background:#13294a}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ================= HERO CAROUSEL ================= */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-2);aspect-ratio:21/9;min-height:300px;background:#13294a}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;visibility:hidden}
.slide.on{opacity:1;visibility:visible}
.slide .scene{position:absolute;inset:0}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,16,32,.82) 0%,rgba(6,16,32,.55) 45%,rgba(6,16,32,.05) 75%),linear-gradient(0deg,rgba(6,16,32,.5) 0%,transparent 40%)}
.slide .cap{position:absolute;left:0;bottom:0;top:0;width:min(640px,72%);padding:32px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px;z-index:2;color:#fff}
.pill{display:inline-flex;align-items:center;align-self:flex-start;height:26px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--c,var(--blue));color:#fff}
.cap h2{margin:0;font-size:38px;line-height:1.12;font-weight:800;letter-spacing:-.5px}
.cap h2 button{all:unset;cursor:pointer}
.cap h2 button:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.cap h2 button:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.6);border-radius:6px}
.cap p{margin:0;font-size:15.5px;line-height:1.55;max-height:4.65em;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cap .hm{display:flex;gap:18px;font-size:13px;color:rgba(255,255,255,.85);align-items:center;flex-wrap:wrap}
.cap .hm span{display:inline-flex;align-items:center;gap:6px}
.hctl{position:absolute;right:20px;bottom:18px;display:flex;gap:8px;z-index:3}
.hctl button{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#0F1E33;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hctl button:hover{background:#fff}
.dots{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.dots button{width:8px;height:8px;border-radius:999px;border:none;background:rgba(255,255,255,.5);padding:0;transition:width .2s}
.dots button[aria-current="true"]{width:22px;background:#fff}

/* ================= CARDS ================= */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.card,.slide,.card:hover{transition:none;transform:none}}
.card .scene{aspect-ratio:16/9}
.card .cb{padding:14px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.src{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.src b{color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.src time{white-space:nowrap}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex:0 0 auto}
.card h3{margin:0;font-size:16px;line-height:1.35;font-weight:700;letter-spacing:-.1px}
.card h3 button,.row-card h3 button{all:unset;cursor:pointer}
.card h3 button:hover,.row-card h3 button:hover{color:var(--blue)}
.card h3 button:focus-visible,.row-card h3 button:focus-visible{box-shadow:var(--focus);border-radius:4px}
.card p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--text))}
[data-theme="dark"] .bd{color:color-mix(in srgb,var(--c) 75%,#fff)}
.bd.lang{--c:var(--muted)}
.bd.proj{--c:#0F766E;background:color-mix(in srgb,#0F766E 14%,transparent);color:#0F766E}
[data-theme="dark"] .bd.proj{color:#5EEAD4}
.bd.region{--c:var(--seg-region)}
.bd.new{--c:var(--success)}
.bd.kind{--c:var(--navy-3)}
[data-theme="dark"] .bd.kind{--c:var(--blue)}
.ib{width:34px;height:34px;border-radius:9px;border:none;background:none;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib[aria-pressed="true"]{color:var(--blue)}
.card.read h3,.row-card.read h3{color:var(--muted)}

.row-card{display:grid;grid-template-columns:200px 1fr;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;box-shadow:var(--sh-1)}
.row-card .scene{border-radius:10px;aspect-ratio:16/10;align-self:start}
.row-card .cb{display:flex;flex-direction:column;gap:6px;min-width:0}
.row-card h3{margin:0;font-size:16.5px;line-height:1.35;font-weight:700}
.row-card p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:14px}

/* briefing */
.brief{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:6px 18px}
.brief li{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.brief li:first-child{border-top:none}
.brief ul{list-style:none;margin:0;padding:0}
.brief button.t{all:unset;cursor:pointer;font-size:14.5px;font-weight:600;line-height:1.4}
.brief button.t:hover{color:var(--blue)}
.brief button.t:focus-visible{box-shadow:var(--focus);border-radius:4px}
.brief small{color:var(--muted);font-size:12px;white-space:nowrap}

/* page header + filters */
.ph{margin:4px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:620px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs button{border:none;background:none;padding:0;color:var(--muted);font-size:13px}
.crumbs button:hover{color:var(--blue)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.sel{height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 12px;font-size:13.5px;box-shadow:var(--sh-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
[data-theme="dark"] .btn.primary{background:var(--blue);border-color:var(--blue);color:#06101f}
.btn[aria-pressed="true"]{border-color:var(--navy-3);background:var(--blue-soft);color:var(--blue)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:none;height:34px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cat{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10;border:none;padding:0;text-align:left;box-shadow:var(--sh-1)}
.cat .scene{position:absolute;inset:0}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,16,32,.78) 0%,rgba(6,16,32,.1) 60%)}
.cat .lbl{position:absolute;left:16px;bottom:14px;z-index:2;color:#fff}

.cat:hover{box-shadow:var(--sh-2)}

/* article page */
.article{max-width:860px}
.a-hero{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:21/9;box-shadow:var(--sh-2)}

.a-acts{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:2}
.a-acts button,.a-acts a{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.94);color:#0F1E33;border:none;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.a-acts button[aria-pressed="true"]{color:var(--blue)}
.a-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px;font-size:13px;color:var(--muted)}
.a-meta .tools{margin-left:auto;display:flex;gap:6px}
.article h1{margin:0 0 12px;font-size:calc(34px*var(--rs));line-height:1.18;font-weight:800;letter-spacing:-.5px}
.ai-box{margin:20px 0;border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:var(--r-md);padding:16px 20px;background:var(--surface)}
.ai-box .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2)}
.ai-box .ai{background:var(--blue-soft);color:var(--blue);padding:2px 7px;border-radius:5px;font-size:11px}
.ai-box p{margin:0;font-size:calc(17.5px*var(--rs));line-height:1.65}
.ai-box small{display:block;margin-top:10px;color:var(--muted);font-size:12px}
.orig{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:var(--r-md);background:var(--surface-2);flex-wrap:wrap}
.orig p{margin:0;font-size:14px;color:var(--text-2)}
.a-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.a-info div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.a-info small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.a-info b{font-size:14px}

/* settings / sources */
.set{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--sh-1)}
.set h2{margin:0 0 4px;font-size:16px}
.set > p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.set-row:first-of-type{border-top:none}
.input{height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 12px;font-size:14px}
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--sh-1)}
.srow b{font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12.5px}
.srow .r{display:flex;gap:6px;flex:0 0 auto}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}

.empty{text-align:center;padding:56px 20px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg)}
.empty .icon{width:40px;height:40px;color:var(--muted)}
.empty h3{margin:12px 0 4px;font-size:17px}
.empty p{margin:0 auto 16px;color:var(--muted);font-size:14px;max-width:420px}
.foot{color:var(--muted);font-size:12.5px;margin-top:36px;padding-top:16px;border-top:1px solid var(--border)}
.more-wrap{text-align:center;margin-top:20px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:all .2s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-lg)}
@keyframes sk{to{background-position:-200% 0}}

/* bottom nav */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{border:none;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.bnav button[aria-current="page"]{color:var(--navy)}
[data-theme="dark"] .bnav button[aria-current="page"]{color:var(--blue)}
.bnav .icon{width:22px;height:22px}


/* expandable groups */
.nv-row{display:flex;align-items:center;border-radius:10px}
.nv-row .nv-main{flex:1;min-width:0}
.nv-row .nv-main span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .tot{margin-left:auto;font-size:12px;color:#8FA3BC;font-weight:600}
.nv-chev{width:36px;height:36px;flex:0 0 auto;border:none;background:none;color:#C9D6E6;border-radius:8px;display:grid;place-items:center}
.nv-chev:hover{background:rgba(255,255,255,.08);color:#fff}
.nv-chev .chev{transition:transform .2s}
.nv-chev[aria-expanded="false"] .chev{transform:rotate(180deg)}
.sv.zero{opacity:.45}
.sb-top{display:flex;align-items:flex-start;justify-content:space-between}
.sb-close{display:none;width:40px;height:40px;border:none;background:rgba(255,255,255,.08);color:#fff;border-radius:10px;place-items:center}
.drawer-scrim{position:fixed;inset:0;background:rgba(6,16,32,.5);z-index:44;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-scrim.open{opacity:1;pointer-events:auto}

@media (max-width:1280px){.grid-main{grid-template-columns:minmax(0,1fr) 300px}.cap h2{font-size:32px}}

}

  .chiprow{padding:4px 16px 12px}
  .segrow{padding:0 16px 10px}

  .wrap{padding:4px 16px 32px}

  .hero{aspect-ratio:auto;height:380px;border-radius:var(--r-lg)}

  .cap h2{font-size:24px}
  .cap p{-webkit-line-clamp:2;font-size:14px}
  .hctl{display:none}
  .dots{left:auto;right:18px;transform:none;bottom:18px}
  .cards3,.cards2,.cat-grid{grid-template-columns:1fr}
  .cards3.hscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .cards3.hscroll::-webkit-scrollbar{display:none}
  .cards3.hscroll .card{flex:0 0 78%;scroll-snap-align:start}
  .row-card{grid-template-columns:110px 1fr;gap:12px;padding:10px}
  .row-card p{display:none}
  .row-card h3{font-size:15px}
  .brief li{grid-template-columns:1fr;gap:2px}
  .brief small{display:none}
  .article h1{font-size:calc(25px*var(--rs))}
  .a-hero{aspect-ratio:16/10}
  .a-info{grid-template-columns:1fr 1fr}
  .srcs{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:1fr 1fr}
  .pop{position:fixed;left:12px;right:12px;top:64px;width:auto}
  .sec-h h2{font-size:19px}
}
</style>

/* ================= THEME ================= */
function isDark(){return S.themePref==="dark"||(S.themePref==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function applyTheme(){document.documentElement.dataset.theme=isDark()?"dark":"light"}

/* ================= COMPONENTS ================= */
function srcLine(i,withDate=true){return '<div class="src"><span class="av" style="background:hsl('+hue(i.source)+' 55% 42%)">'+esc(initials(i.source))+'</span><b>'+esc(i.source)+'</b>'+(withDate?'<span aria-hidden="true">·</span><time datetime="'+esc(i.date)+'">'+esc(pD(i.date)?rel(i.date):i.date)+'</time>':"")+'</div>'}
function badges(i){return '<span class="bd" style="--c:'+SEGVAR[i.seg]+'">'+L(i.seg)+'</span>'+(i.project?'<span class="bd proj">'+L("projB")+'</span>':"")+(i.kind?'<span class="bd kind">'+L("k_"+i.kind)+'</span>':"")+'<span class="bd lang">'+esc(i.reg==="tr"?"TR":(i.lang||"EN"))+'</span>'+(i.star?'<span class="bd region">★ '+L("regionB")+'</span>':"")+(i.isNew?'<span class="bd new">'+L("newB")+'</span>':"")}
function saveBtn(i){const s=S.saved.includes(i.id);return '<button class="ib" data-save="'+i.id+'" aria-pressed="'+s+'" aria-label="'+(s?L("unsave"):L("save"))+'" title="'+(s?L("unsave"):L("save"))+'">'+ic("bookmark",s)+'</button>'}
function card(i){const read=S.history.includes(i.id);return '<article class="card'+(read?" read":"")+'">'+scene(i.seg,i.id)+'<div class="cb">'+srcLine(i)+'<h3 lang="'+langOf(i)+'"><button data-open="'+i.id+'">'+esc(i.title)+'</button></h3><div class="cf"><div class="badges">'+badges(i)+'</div>'+saveBtn(i)+'</div></div></article>'}
function rowCard(i){const read=S.history.includes(i.id);return '<article class="row-card'+(read?" read":"")+'">'+scene(i.seg,i.id)+'<div class="cb">'+srcLine(i)+'<h3 lang="'+langOf(i)+'"><button data-open="'+i.id+'">'+esc(i.title)+'</button></h3><p lang="'+langOf(i)+'">'+esc(i.summary)+'</p><div class="cf"><div class="badges">'+badges(i)+'</div><div style="display:flex">'+saveBtn(i)+'<button class="ib" data-copy="'+esc(i.url)+'" aria-label="'+L("share")+'" title="'+L("share")+'">'+ic("share")+'</button></div></div></div></article>'}
function secH(t,view){return '<div class="sec-h"><h2>'+esc(t)+'</h2>'+(view?'<button class="linkbtn" data-view="'+view+'">'+L("seeAll")+' '+ic("right")+'</button>':"")+'</div>'}
function empty(icn,h,p,btn,attr){return '<div class="empty">'+ic(icn)+'<h3>'+esc(h)+'</h3><p>'+esc(p)+'</p>'+(btn?'<button class="btn primary" '+attr+'>'+esc(btn)+'</button>':"")+'</div>'}

/* ================= SIDE COLUMN ================= */
function sideCol(){
  const latest=vis().filter(i=>pD(i.date)).sort(byDate).slice(0,5);
  const ind=SEGS.filter(s=>!S.hidden.includes(s)).map(s=>vis().filter(i=>i.seg===s&&pD(i.date)).sort(byDate)[0]).filter(Boolean);
  return '<aside class="col-side" aria-label="'+L("trending")+'">'+
   '<section class="panel"><div class="panel-h"><h2>'+ic("bolt")+L("trending")+'</h2><button class="linkbtn" data-view="categories">'+L("seeAll")+' '+ic("right")+'</button></div><div class="tags">'+TREND.slice(0,11).map(([t],k)=>'<button class="htag'+(k===0?" hot":"")+'" data-topic="'+esc(t)+'">#'+esc(t)+'</button>').join("")+'</div></section>'+
   '<section class="panel"><div class="panel-h"><h2>'+ic("clock")+L("latestAdded")+'</h2><button class="linkbtn" data-view="all">'+L("seeAll")+' '+ic("right")+'</button></div>'+latest.map(i=>'<button class="mini" data-open="'+i.id+'">'+scene(i.seg,i.id)+'<span><b lang="'+langOf(i)+'">'+esc(i.title)+'</b><small>'+esc(i.source)+' · '+esc(rel(i.date))+'</small></span></button>').join("")+'</section>'+
   '<section class="panel"><div class="panel-h"><h2>'+ic("layers")+L("industry")+'</h2></div>'+ind.map(i=>'<button class="mini" data-open="'+i.id+'" style="grid-template-columns:1fr"><span><small style="margin:0 0 3px;font-weight:700;color:'+SEGVAR[i.seg]+'">'+L(i.seg)+'</small><b lang="'+langOf(i)+'">'+esc(i.title)+'</b><small>'+esc(i.source)+' · '+esc(rel(i.date))+'</small></span></button>').join("")+'</section>'+
  '</aside>';
}

/* ================= VIEWS ================= */
function heroSlides(){
  const items=vis();
  const reg=items.filter(i=>i.star).sort(byDate);
  const dated=items.filter(i=>pD(i.date)).sort(byDate);
  const out=[];if(reg[0])out.push(reg[0]);dated.forEach(i=>{if(out.length<4&&!out.includes(i))out.push(i)});
  return out;
}
function heroHTML(slides){
  return '<section class="hero" aria-roledescription="carousel" aria-label="'+L("featured")+'" id="hero">'+slides.map((i,k)=>'<div class="slide'+(k===S.slide?" on":"")+'" role="group" aria-roledescription="slide" aria-label="'+L("slide")+' '+(k+1)+'/'+slides.length+'"'+(k===S.slide?"":' aria-hidden="true"')+'>'+scene(i.seg,i.id+"hero")+'<div class="cap"><span class="pill" style="--c:'+SEGVAR[i.star?"region":i.seg]+'">'+(i.star?L("regionB"):L(i.seg))+'</span><h2 lang="'+langOf(i)+'"><button data-open="'+i.id+'"'+(k===S.slide?"":' tabindex="-1"')+'>'+esc(i.title)+'</button></h2><p lang="'+langOf(i)+'">'+esc(i.summary)+'</p><div class="hm"><span>'+ic("cal")+esc(pD(i.date)?shortD(i.date):i.date)+'</span><span>'+ic("doc")+esc(i.source)+'</span></div></div></div>').join("")+
   (slides.length>1?'<div class="dots">'+slides.map((_,k)=>'<button data-slide="'+k+'" aria-label="'+L("slide")+' '+(k+1)+'" aria-current="'+(k===S.slide)+'"></button>').join("")+'</div><div class="hctl"><button data-slide="prev" aria-label="'+L("prev")+'">'+ic("left")+'</button><button data-slide="next" aria-label="'+L("next")+'">'+ic("right")+'</button></div>':"")+'</section>';
}
function viewHome(){
  const items=vis();const slides=heroSlides();if(S.slide>=slides.length)S.slide=0;
  const used=new Set(slides.map(i=>i.id));
  const feat=items.filter(i=>!used.has(i.id)).sort((a,b)=>(b.star-a.star)||byDate(a,b)).slice(0,3);feat.forEach(i=>used.add(i.id));
  let main=heroHTML(slides);
  main+=secH(L("featured"),"featured")+'<div class="cards3 hscroll">'+feat.map(card).join("")+'</div>';
  main+=secH(L("briefing"))+'<section class="brief"><ul>'+SEGS.filter(s=>!S.hidden.includes(s)).map(s=>{const t=items.filter(i=>i.seg===s&&pD(i.date)).sort(byDate)[0]||items.find(i=>i.seg===s);return t?'<li><span class="bd" style="--c:'+SEGVAR[s]+';justify-self:start">'+L(s)+'</span><button class="t" data-open="'+t.id+'" lang="'+langOf(t)+'">'+esc(t.title)+'</button><small>'+esc(t.source)+'</small></li>':""}).join("")+'</ul></section>';
  const latest=items.filter(i=>!used.has(i.id)).sort(byDate).slice(0,6);
  if(latest.length)main+=secH(L("latest"),"all")+'<div class="stack">'+latest.map(rowCard).join("")+'</div>';
  const rec=recommend(3);
  main+=secH(L("forYou"))+(rec.list.length?'<p style="margin:-6px 0 12px;color:var(--muted);font-size:13px">'+L("recWhy")+' '+rec.why+'</p><div class="cards3">'+rec.list.map(card).join("")+'</div>':'<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><p style="margin:0;color:var(--text-2)">'+L("recEmpty")+'</p><button class="btn primary" data-view="settings">'+L("recBtn")+'</button></div>');
  main+='<p class="foot">'+L("updated")+': '+esc(updStr())+' · '+L("about")+'</p>';
  return '<div class="grid-main"><div>'+main+'</div>'+sideCol()+'</div>';
}
function recommend(n){
  const w={};S.history.forEach(id=>{const i=get(id);if(i)w[i.seg]=(w[i.seg]||0)+1});S.saved.forEach(id=>{const i=get(id);if(i)w[i.seg]=(w[i.seg]||0)+2});
  if(!S.follow.length&&!S.followPubs.length&&!Object.keys(w).length)return {list:[],why:""};
  const sc=i=>(S.follow.includes(i.seg)?5:0)+(S.followPubs.includes(i.source)?4:0)+(w[i.seg]||0)+(i.isNew?1:0);
  const list=vis().filter(i=>!S.history.includes(i.id)).map(i=>[i,sc(i)]).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]||byDate(a[0],b[0])).slice(0,n).map(x=>x[0]);
  return {list,why:[S.follow.length||S.followPubs.length?L("recFollow"):null,Object.keys(w).length?L("recRead"):null].filter(Boolean).join(" + ")};
}
function filterBar(segF){
  return '<div class="filters" role="group">'+(false?'<label class="sr-only" for="fSeg">'+L("category")+'</label><select class="sel" id="fSeg"><option value="all">'+L("category")+': '+L("all")+'</option>'+SEGS.map(s=>'<option value="'+s+'"'+(S.fSeg===s?" selected":"")+'>'+L(s)+'</option>').join("")+'</select>':"")+
   '<label class="sr-only" for="fPub">'+L("source")+'</label><select class="sel" id="fPub"><option value="">'+L("allPubs")+'</option>'+PUBS.map(p=>'<option'+(S.fPub===p?" selected":"")+'>'+esc(p)+'</option>').join("")+'</select>'+
   '<label class="sr-only" for="fDate">'+L("published")+'</label><select class="sel" id="fDate">'+[["any","any"],["7","d7"],["30","d30"]].map(([k,l])=>'<option value="'+k+'"'+(S.fDate===k?" selected":"")+'>'+L(l)+'</option>').join("")+'</select></div>';
}
const applyF=l=>l.filter(i=>(!S.fPub||i.source===S.fPub)&&(S.fSeg==="all"||i.seg===S.fSeg)&&(S.fReg==="all"||i.reg===S.fReg)&&(S.fDate==="any"||(pD(i.date)&&Date.now()-ts(i)<=+S.fDate*864e5)));
function listView(title,desc,list,opt={}){
  const f=applyF(list).sort(opt.sort||byDate);
  let h='<div class="ph"><div><h1>'+esc(title)+'</h1>'+(desc?'<p>'+esc(desc)+'</p>':"")+'</div>'+(opt.head||"")+'</div>'+filterBar(opt.segF);
  if(!f.length)h+=empty("search",L("noResults"),L("noResultsTip"),L("clearF"),'data-clearf="1"');
  else{h+='<div class="stack">'+f.slice(0,S.limit).map(rowCard).join("")+'</div>';if(f.length>S.limit)h+='<div class="more-wrap"><button class="btn" data-more="1">'+L("showMore")+' ('+(f.length-S.limit)+')</button></div>'}
  return '<div class="grid-main"><div>'+h+'</div>'+sideCol()+'</div>';
}
function followBtns(s){const f=S.follow.includes(s),h=S.hidden.includes(s);return '<div style="display:flex;gap:8px"><button class="btn'+(f?"":" primary")+'" data-follow="'+s+'" aria-pressed="'+f+'">'+(f?"✓ "+L("following"):"+ "+L("follow"))+'</button><button class="btn" data-hide="'+s+'" aria-pressed="'+h+'">'+(h?L("hidden"):L("hide"))+'</button></div>'}
function viewCategories(){
  const cats=["region"].concat(SEGS);
  return '<div class="ph"><div><h1>'+L("categories")+'</h1></div></div><div class="cat-grid">'+cats.map(c=>{const n=c==="region"?ITEMS.filter(i=>i.star).length:ITEMS.filter(i=>i.seg===c).length;return '<button class="cat" data-view="'+c+'">'+scene(c==="region"?"prot":c,"cat"+c)+'<span class="lbl"><b>'+L(c)+'</b><span>'+F("count",{n})+'</span></span></button>'}).join("")+'</div>'+
   secH(L("trending"))+'<div class="tags">'+TREND.map(([t,n])=>'<button class="htag" data-topic="'+esc(t)+'">#'+esc(t)+' <span style="color:var(--muted)">'+n+'</span></button>').join("")+'</div>'+
   secH(L("sources"),"sources")+'<p style="margin:0;color:var(--muted);font-size:14px">'+L("sourcesP")+'</p>';
}

  const kws=TOPICS.filter(t=>txt(i).includes(t.toLocaleLowerCase("tr")));const cov=ITEMS.filter(x=>x.id!==i.id&&!related.includes(x)&&kws.some(t=>txt(x).includes(t.toLocaleLowerCase("tr")))).sort(byDate).slice(0,3);

  h+='<article class="article"><div class="a-hero">'+scene(i.seg,i.id+"hero")+'<div class="a-acts"><button data-copy="'+esc(i.url)+'" aria-label="'+L("share")+'" title="'+L("share")+'">'+ic("share")+'</button><button data-save="'+i.id+'" aria-pressed="'+s+'" aria-label="'+(s?L("unsave"):L("save"))+'" title="'+(s?L("unsave"):L("save"))+'">'+ic("bookmark",s)+'</button><a href="'+esc(i.url)+'" target="_blank" rel="noopener" aria-label="'+L("open")+'" title="'+L("open")+'">'+ic("ext")+'</a></div></div>'+
   '<div class="a-meta"><div class="badges">'+badges(i)+'</div>'+srcLine(i,false)+'<span>'+esc(longD(i.date))+'</span><span class="tools"><button class="btn sm" data-rs="-1" aria-label="'+L("fontDown")+'">A−</button><button class="btn sm" data-rs="1" aria-label="'+L("fontUp")+'">A+</button></span></div>'+

function tabPool(t){const base=vis();if(t==="global")return base.filter(i=>!isTR(i));const tr=base.filter(isTR);return t==="latest"?tr:tr.filter(i=>i.seg===t)}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open],[data-view],[data-save],[data-copy],[data-topic],[data-sq],[data-spub],[data-follow],[data-hide],[data-fpub],[data-settheme],[data-more],[data-clearf],[data-clearhist],[data-clearsh],[data-rs],[data-slide],[data-back],[data-markseen],[data-toggletheme],[data-segchip],[data-scope]");
  if(!e.target.closest(".rel"))closePops();
  if(!e.target.closest(".searchbox"))closeSuggest();
  if(!el)return;const d=el.dataset;
  if(d.open){e.preventDefault();openArticle(d.open);return}
  if(d.view){e.preventDefault();go(d.view,false,d.seg);return}
  if(d.scope){S.fScope=d.scope;S.limit=12;renderView();renderChips();renderSidebar();window.scrollTo({top:0});return}
  if(d.segchip&&S.view==="global"){S.fSeg=d.segchip;S.limit=12;renderView();renderChips();renderSidebar();window.scrollTo({top:0});return}
  if(d.segchip){const sc=scopeOf();const k=d.segchip;
    if(INPLACE.includes(sc)){S.fSeg=k;S.limit=12;renderView();renderChips();renderSidebar();window.scrollTo({top:0});return}
    go(k==="all"?"home":k);return}
  if(d.back){go(S.prevView||"home");return}
  if(d.save){const on=S.saved.includes(d.save);S.saved=on?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];store.set("saved",S.saved);toast(on?L("removedS"):L("addedS"));renderView();return}
  if(d.copy){const u=d.copy;try{navigator.clipboard.writeText(u).then(()=>toast(L("copied")),()=>toast(u))}catch(err){toast(u)}return}
  if(d.topic||d.sq){doSearch(d.topic||d.sq);return}
  if(d.spub){closeSuggest();go("all");S.fPub=d.spub;renderView();return}
  if(d.follow){S.follow=S.follow.includes(d.follow)?S.follow.filter(x=>x!==d.follow):[...S.follow,d.follow];store.set("follow",S.follow);renderView();return}
  if(d.hide){S.hidden=S.hidden.includes(d.hide)?S.hidden.filter(x=>x!==d.hide):[...S.hidden,d.hide];store.set("hidden",S.hidden);renderView();return}
  if(d.fpub){S.followPubs=S.followPubs.includes(d.fpub)?S.followPubs.filter(x=>x!==d.fpub):[...S.followPubs,d.fpub];store.set("followPubs",S.followPubs);renderView();return}
  if(d.settheme){S.themePref=d.settheme;store.set("theme",S.themePref);render();return}
  if(d.toggletheme){S.themePref=isDark()?"light":"dark";store.set("theme",S.themePref);render();return}
  if(d.more){S.limit+=12;renderView();return}
  if(d.clearf){resetF();renderView();return}
  if(d.clearhist){S.history=[];store.set("history",[]);renderView();return}
  if(d.clearsh){e.stopPropagation();S.searchHist=[];store.set("searchHist",[]);renderSuggest();return}
  if(d.rs){S.rs=Math.min(1.3,Math.max(.85,+(S.rs+(+d.rs)*.075).toFixed(3)));store.set("rs",S.rs);document.documentElement.style.setProperty("--rs",S.rs);return}
  if(d.slide){setSlide(d.slide==="prev"?S.slide-1:d.slide==="next"?S.slide+1:+d.slide);return}
  if(d.markseen){S.seen=[...new Set([...S.seen,...ITEMS.filter(i=>i.isNew).map(i=>i.id)])];store.set("seen",S.seen);renderTop();renderBell();return}
});

$("q").addEventListener("focus",renderSuggest);$("q").addEventListener("input",renderSuggest);
$("q").addEventListener("keydown",e=>{const o=[...$("suggest").querySelectorAll(".sg")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!o.length)return;sgi=(sgi+(e.key==="ArrowDown"?1:-1)+o.length)%o.length;o.forEach((x,k)=>x.classList.toggle("active",k===sgi));o[sgi].scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"){e.preventDefault();if(sgi>=0&&o[sgi])o[sgi].click();else doSearch($("q").value);return}
  if(e.key==="Escape"){closeSuggest();$("q").blur()}});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("searchbox").classList.add("open");$("q").focus();return}
  if(e.key==="/"&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$("searchbox").classList.add("open");$("q").focus();return}
  if(e.key==="Escape"){closePops();closeDrawer()}
  if(S.view==="home"&&$("hero")&&$("hero").contains(document.activeElement)){if(e.key==="ArrowRight")setSlide(S.slide+1);if(e.key==="ArrowLeft")setSlide(S.slide-1)}
});
if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.themePref==="system")render()})}catch(e){}}
/* mobile search button visibility */
const mq=window.matchMedia?matchMedia("(max-width:900px)"):null;function mqF(){$("mSearch").style.display=mq&&mq.matches?"":"none"}if(mq){try{mq.addEventListener("change",mqF)}catch(e){}}mqF();
document.documentElement.style.setProperty("--rs",S.rs);
render();startAuto();
/* Canlı RSS/API akışı (Supabase) — sadece okuma */
(function(){
  const SUPA="https://qpwkiauhazpyaywjderc.supabase.co/rest/v1/",KEY="sb_publishable_eDv33WBVXDj1bmVkNS3Pxw_-4Cn_iPj";
  const H={apikey:KEY};
  const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  Promise.all([
    fetch(SUPA+"news_items?select=id,seg,reg,lang,kind,star,title,summary,source,date,url,deadline,project&date=gte."+since+"&order=date.desc&limit=400",{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(SUPA+"feed_runs?select=ran_at&order=id.desc&limit=1",{headers:H}).then(r=>r.ok?r.json():[])
  ]).then(([rows,runs])=>{
    const urls=new Set(ITEMS.map(i=>i.url)),keys=new Set(ITEMS.map(i=>i.title.toLocaleLowerCase("tr").replace(/[^a-z0-9ğüşıöç]+/g," ").trim().slice(0,60)));
    let n=0;
    for(const r of rows||[]){
      const k=(r.title||"").toLocaleLowerCase("tr").replace(/[^a-z0-9ğüşıöç]+/g," ").trim().slice(0,60);
      if(!r.url||urls.has(r.url)||keys.has(k))continue;urls.add(r.url);keys.add(k);
      const it={id:r.id,seg:r.seg,reg:r.reg,lang:r.lang,star:!!r.star,isNew:(Date.now()-Date.parse(r.date))<2*864e5,title:r.title,summary:r.summary||"",source:r.source,date:r.date,url:r.url,feed:true};
      if(r.kind)it.kind=r.kind;if(r.deadline)it.deadline=r.deadline;
      if(NOISE.test(it.title+" "+it.summary)||NOISESRC.test(it.source||""))continue;
      if(r.project)it.project=true;else if(!isPaint(it))continue;
      ITEMS.push(it);n++;
    }
    if(runs&&runs[0]&&runs[0].ran_at)LIVE_TS=new Date(runs[0].ran_at);
    if(n||LIVE_TS)render();
  }).catch(()=>{});
})();
