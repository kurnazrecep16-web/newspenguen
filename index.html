  {n:"Riviera Maritime Media",d:"Hull coatings, webinarlar",w:"https://www.rivieramm.com/news-content-hub",li:"q:Riviera Maritime Media"},
  {n:"Hellenic Shipping News",d:"Günlük denizcilik haberleri",w:"https://www.hellenicshippingnews.com",li:"q:Hellenic Shipping News"},
  {n:"Marine Link",d:"Antifouling, hull coatings",w:"https://www.marinelink.com/news/maritime/hull-coatings",li:"q:Marine Link Maritime Reporter"},
  {n:"The Maritime Executive",d:"Armatör, tersane haberleri",w:"https://maritime-executive.com",li:"q:The Maritime Executive"},
  {n:"Cyprus Shipping News",d:"Marine boya basın bültenleri",w:"https://cyprusshippingnews.com",li:"q:Cyprus Shipping News"},
  {n:"Clean Shipping International",d:"Marine coatings & hull protection",w:"https://www.cleanshippinginternational.com",li:"q:Clean Shipping International"},
  {n:"Safety4Sea",d:"IMO, regülasyon",w:"https://safety4sea.com",li:"q:SAFETY4SEA"}]},
 {g:"🛡 Protective",items:[
  {n:"AMPP",d:"Korozyon, standartlar (eski NACE/SSPC)",w:"https://www.ampp.org",li:"q:AMPP Association for Materials Protection and Performance"},
  {n:"PaintSquare / JPCL",d:"Koruyucu boya projeleri",w:"https://www.paintsquare.com",li:"q:PaintSquare JPCL"},
  {n:"Engineering News",d:"Altyapı, PFP ürün haberleri",w:"https://www.engineeringnews.co.za",li:""}]},
 {g:"🎨 Powder",items:[
  {n:"Products Finishing – Powder",d:"Toz boya haber akışı",w:"https://www.pfonline.com/topics/powder",li:"q:Products Finishing"},
  {n:"Powder Coated Tough",d:"Toz boya dergisi",w:"https://www.powdercoatedtough.com",li:"q:Powder Coating Institute"}]},
 {g:"🇹🇷 Türkiye",items:[
  {n:"Turkchem",d:"Kimya ve boya sektörü",w:"https://turkchem.net",li:"q:Turkchem"},
  {n:"Sanayi Gazetesi",d:"OSB ve fabrika yatırım haberleri",w:"https://sanayigazetesi.com.tr",li:""},
  {n:"Ekonomi Gazetesi – Sektör",d:"Boya sektörü haberleri",w:"https://www.ekonomigazetesi.com",li:""},
  {n:"Dünya Gazetesi",d:"Sektörler",w:"https://www.dunya.com/sektorler",li:""},
  {n:"Ticaret Bakanlığı – Boya Sektörü Raporu 2026",d:"Resmi sektör raporu",w:"https://ticaret.gov.tr",li:""}]}
];

const SEGS=[["all","Tümü"],["star","⭐ Bölgem"],["deco","🏠 Dekoratif"],["marine","⚓ Marine"],["prot","🛡 Protective"],["powder","🎨 Powder"],["corp","🏢 Jotun & Rakipler"],["saved","🔖 Kaydedilenler"],["src","🔗 Kaynaklar"]];
const REGS=[["all","🌐 Hepsi"],["global","🌍 Global"],["tr","🇹🇷 Türkiye"]];
const SEGNAME={deco:"Dekoratif",marine:"Marine",prot:"Protective",powder:"Powder",corp:"Jotun & Rakipler"};
let seg="all",reg="all",q="";
let saved=[];try{saved=JSON.parse(localStorage.getItem("np_saved")||"[]")}catch(e){}
function persist(){try{localStorage.setItem("np_saved",JSON.stringify(saved))}catch(e){}}
function fmt(d){if(/^\d{4}$/.test(d))return d+" (gün belirtilmemiş)";const [y,m,g]=d.split("-");return g+"."+m+"."+y}
function chips(el,arr,cur,fn){el.innerHTML="";arr.forEach(([k,l])=>{const b=document.createElement("button");b.className="chip"+(k===cur?" on":"");b.textContent=l;b.onclick=()=>fn(k);el.appendChild(b)})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function liUrl(li){return li.startsWith("q:")?"https://www.linkedin.com/search/results/companies/?keywords="+encodeURIComponent(li.slice(2)):li}
function renderSources(el){
  let html='<div class="note" style="margin:6px 0 4px;text-align:left">LinkedIn butonları şirketin LinkedIn sayfasını ya da LinkedIn şirket aramasını açar (resmi sayfa ilk sırada çıkar). LinkedIn içeriğini görmek için LinkedIn hesabınla giriş yapman gerekir.</div>';
  SOURCES.forEach(gr=>{
    const its=gr.items.filter(s=>!q||(s.n+" "+s.d).toLocaleLowerCase("tr").includes(q));
    if(!its.length)return;
    html+='<div class="sec">'+gr.g+'</div>';
    its.forEach(s=>{html+='<div class="src"><div><b>'+esc(s.n)+'</b><small>'+esc(s.d)+'</small></div><div class="links"><a class="btn" href="'+s.w+'" target="_blank" rel="noopener">🌐 Site</a>'+(s.li?'<a class="btn li" href="'+liUrl(s.li)+'" target="_blank" rel="noopener">in LinkedIn</a>':'')+'</div></div>'})});
  el.innerHTML=html;
}
function render(){
  chips(document.getElementById("segChips"),SEGS,seg,k=>{seg=k;render()});
  const regEl=document.getElementById("regChips");
  const el=document.getElementById("list");
  if(seg==="src"){regEl.style.display="none";renderSources(el);return}
  regEl.style.display="flex";
  chips(regEl,REGS,reg,k=>{reg=k;render()});
  let list=ITEMS.filter(i=>{
    if(seg==="star"&&!i.star)return false;
    if(seg==="saved"&&!saved.includes(i.id))return false;
    if(!["all","star","saved"].includes(seg)&&i.seg!==seg)return false;
    if(reg!=="all"&&i.reg!==reg)return false;
    if(q){const t=(i.title+" "+i.summary+" "+i.source).toLocaleLowerCase("tr");if(!t.includes(q))return false}
    return true});
  const key=d=>/^\d{4}$/.test(d)?d+"-00-00":d;
  list.sort((a,b)=>(b.star-a.star)||(reg==="all"?(a.reg===b.reg?0:(a.reg==="global"?-1:1)):0)||key(b.date).localeCompare(key(a.date)));
  if(!list.length){el.innerHTML='<div class="empty">Bu filtrede haber yok.</div>';return}
  let html="",lastGroup=null;
  list.forEach(i=>{
    const grp=i.star?"star":i.reg;
    if(grp!==lastGroup){html+='<div class="sec">'+(grp==="star"?"⭐ Bölgem · Trakya & Avrupa Yakası":grp==="global"?"🌍 Global":"🇹🇷 Türkiye")+'</div>';lastGroup=grp}
    html+='<div class="card'+(i.star?" star":"")+'"><div class="tags"><span class="tag t-'+i.seg+'">'+SEGNAME[i.seg]+'</span><span class="reg">'+(i.reg==="tr"?"🇹🇷 Türkiye":"🌍 Global")+'</span><span class="lang">'+(i.lang||"")+'</span>'+(i.star?'<span class="starb">⭐ Bölgem</span>':'')+(i.isNew?'<span class="newb">YENİ</span>':'')+'</div><h3 lang="'+(i.lang==="TR"?"tr":"en")+'">'+esc(i.title)+'</h3><p lang="'+(i.lang==="TR"?"tr":"en")+'">'+esc(i.summary)+'</p><div class="foot"><span>'+esc(i.source)+' · '+fmt(i.date)+'</span><span><button class="save'+(saved.includes(i.id)?" on":"")+'" data-id="'+i.id+'" aria-label="Kaydet">'+(saved.includes(i.id)?"★":"☆")+'</button> <a href="'+i.url+'" target="_blank" rel="noopener">Habere git →</a></span></div></div>'});
  html+='<div class="note">Global haberler orijinal dilinde, Türkiye haberleri Türkçe verilir. Özetler kaynak metinden kopyalanmadan yazılmıştır; ayrıntı için kaynağa gidin.<br>Kaydettiklerin sadece bu cihazda saklanır.</div>';
  el.innerHTML=html;
  el.querySelectorAll(".save").forEach(b=>b.onclick=()=>{const id=b.dataset.id;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render()});
}
document.getElementById("upd").textContent="🕒 Son güncelleme: "+UPDATED;
document.getElementById("cnt").textContent="🆕 "+ITEMS.filter(i=>i.isNew).length+" yeni · toplam "+ITEMS.length+" · 🌍 "+ITEMS.filter(i=>i.reg==="global").length+" / 🇹🇷 "+ITEMS.filter(i=>i.reg==="tr").length;
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLocaleLowerCase("tr");render()});
render();
</script>
</body>
</html>
