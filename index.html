<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173B63">
<title>NEWSPENGUEN Haber Akışı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS — 4px spacing scale, type scale, colours
   ========================================================= */
:root{
  --primary:#173B63;--primary-600:#12304f;--secondary:#526B84;--accent:#2F6FB3;
  --bg:#F6F8FA;--surface:#FFFFFF;--surface-2:#F0F3F7;--text:#172433;--text-2:#3B4A5C;--muted:#718096;--border:#E5EAF0;
  --success:#1F7A4D;--warning:#A86A00;--error:#B42318;
  --seg-deco:#B4532A;--seg-marine:#1F6A9A;--seg-prot:#4B7A2A;--seg-powder:#6A4FB0;--seg-corp:#526B84;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;
  --r-sm:6px;--r-md:8px;--r-lg:12px;
  --fs-page:28px;--fs-section:13px;--fs-hero:26px;--fs-headline:17px;--fs-headline-sm:15px;--fs-body:15px;--fs-summary:14px;--fs-meta:12px;--fs-nav:14px;--fs-btn:13px;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow-1:0 1px 2px rgba(23,36,51,.05);
  --shadow-2:0 8px 28px rgba(23,36,51,.14);
  --focus:0 0 0 3px rgba(47,111,179,.35);
  --reader-scale:1;
}
[data-theme="dark"]{
  --primary:#8DB4E2;--primary-600:#a9c7ea;--secondary:#9AAABB;--accent:#7FB0E8;
  --bg:#121417;--surface:#1A1D22;--surface-2:#22262D;--text:#E6EAF0;--text-2:#C2CAD4;--muted:#8E99A8;--border:#2C313A;
  --success:#4CC38A;--warning:#E0A43B;--error:#F07167;
  --seg-deco:#E08A5E;--seg-marine:#5FA8D6;--seg-prot:#8DBA62;--seg-powder:#A895E6;--seg-corp:#9AAABB;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 10px 32px rgba(0,0,0,.5);--focus:0 0 0 3px rgba(127,176,232,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:var(--r-md);z-index:100}
.skip:focus{left:8px}

/* ---------- Buttons / inputs (single system) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:36px;padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);font-size:var(--fs-btn);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .btn.primary{color:#0f1720}
.btn.primary:hover{background:var(--primary-600)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 var(--s2);font-size:12px}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--secondary)}
.icon{width:18px;height:18px;flex:0 0 auto}
.input,.select{height:36px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s3);font-size:14px;width:100%}
.input:focus,.select:focus{outline:none;box-shadow:var(--focus);border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--secondary)}
.pill[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .pill[aria-pressed="true"]{color:#0f1720}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--c,var(--secondary));letter-spacing:.2px}
.tag::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c,var(--secondary))}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.badge.new{border-color:transparent;background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge.region{border-color:transparent;background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.badge.ai{border-color:transparent;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:var(--s5) var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2) var(--s5)}
.brand-name{font-weight:700;letter-spacing:.6px;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.2px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:var(--s4) var(--s2) var(--s1)}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 var(--s2);border-radius:var(--r-md);font-size:var(--fs-nav);font-weight:500;color:var(--text-2);cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item .count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.nav-dot{width:8px;height:8px;border-radius:2px;background:var(--c);margin:0 5px}
.side-foot{margin-top:auto;padding:var(--s4) var(--s2) 0;font-size:11.5px;color:var(--muted);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar .in{display:flex;align-items:center;gap:var(--s2);height:60px;padding:0 var(--s6)}
.m-brand{display:none}
.searchbox{position:relative;flex:1;max-width:560px}
.searchbox .input{padding-left:36px;height:40px;background:var(--surface)}
.searchbox .icon{position:absolute;left:11px;top:11px;color:var(--muted)}
.suggest{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:var(--s2);display:none;z-index:30;max-height:70vh;overflow:auto}
.suggest.open{display:block}
.suggest h6{margin:var(--s2) var(--s2) var(--s1);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;padding:8px;border-radius:var(--r-md);cursor:pointer;font-size:14px}
.sg:hover,.sg.active{background:var(--surface-2)}
.sg small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:var(--s2)}
.content{padding:var(--s6);max-width:1040px;width:100%}

.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid var(--border);padding:var(--s6) var(--s5);background:var(--bg)}
.rail-toggle{display:none}
.rail-close{display:none;justify-content:flex-end}
.card.feature .thumb{aspect-ratio:2/1}
.panel{margin-bottom:var(--s6)}
.panel h3{font-size:var(--fs-section);font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.rlist{list-style:none;margin:0;padding:0;counter-reset:r}
.rlist li{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--border)}
.rlist li:first-child{border-top:none;padding-top:0}
.rlist .n{font-family:var(--serif);font-weight:700;color:var(--secondary);font-size:18px;line-height:1.1;min-width:16px}
.rlist button{border:none;background:none;padding:0;text-align:left;cursor:pointer;font-size:13.5px;font-weight:600;line-height:1.35}
.rlist button:hover{color:var(--accent)}
.rlist small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}

/* ---------- Page header ---------- */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.greet h1{font-family:var(--serif);font-size:var(--fs-page);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.2px}
.greet p{margin:var(--s1) 0 0;color:var(--muted);font-size:13.5px}
.updated{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.updated i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:var(--s8) 0 var(--s3);border-top:2px solid var(--text);padding-top:var(--s2)}
.sec-h h2{font-size:var(--fs-section);font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin:0}
.sec-h .more{font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px}

/* ---------- Briefing ---------- */
.briefing{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5) var(--s6);display:grid;grid-template-columns:200px 1fr;gap:var(--s6)}
.briefing .lead{border-right:1px solid var(--border);padding-right:var(--s6)}
.briefing .lead .kick{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.briefing .lead h2{font-family:var(--serif);font-size:20px;margin:var(--s2) 0;line-height:1.2}
.briefing .lead p{margin:0;font-size:13px;color:var(--muted)}
.briefing .stats{display:flex;gap:var(--s5);margin-top:var(--s4)}
.briefing .stats b{display:block;font-size:22px;font-weight:700;line-height:1}
.briefing .stats span{font-size:11.5px;color:var(--muted)}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:var(--s3)}
.blist li{display:grid;grid-template-columns:118px 1fr;gap:var(--s3);align-items:baseline}
.blist button{border:none;background:none;padding:0;text-align:left;cursor:pointer;font-size:14px;font-weight:600;line-height:1.4}
.blist button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- Cards ---------- */
.top-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--s5)}
.top-side{display:grid;gap:var(--s5)}
.card{position:relative;display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid var(--border)}
.thumb svg.motif{position:absolute;inset:0;width:100%;height:100%;color:var(--c);opacity:.55}
.thumb .src-mark{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:var(--r-sm);padding:3px 8px 3px 3px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow-1);max-width:calc(100% - 20px)}
.thumb .src-mark span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;flex:0 0 auto}
.card .meta-top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.card h3{margin:0;font-family:var(--serif);font-size:var(--fs-headline);line-height:1.3;font-weight:700}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.card h3 button:focus-visible{box-shadow:var(--focus);border-radius:4px}
.card p{margin:0;font-size:var(--fs-summary);color:var(--text-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-meta);color:var(--muted);flex-wrap:wrap}
.card .meta b{color:var(--text-2);font-weight:600}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.card .acts{display:flex;gap:2px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-md);border:none;background:none;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
.card.feature h3{font-size:var(--fs-hero);line-height:1.22}
.card.feature p{-webkit-line-clamp:4;font-size:15px}
.card.read h3{color:var(--muted)}

.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6) var(--s5)}
.hcard{display:grid;grid-template-columns:120px 1fr;gap:var(--s3);align-items:start}
.hcard .thumb{aspect-ratio:4/3}
.hcard h3{font-size:var(--fs-headline-sm)}
.hcard p{-webkit-line-clamp:2;font-size:13px}

.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s5)}
.ins h4{margin:0 0 var(--s2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.ins h4 button{all:unset;cursor:pointer}
.ins h4 button:hover{color:var(--accent)}
.ins ul{list-style:none;margin:0;padding:0}
.ins li{padding:var(--s2) 0;border-top:1px solid var(--border)}
.ins li button{border:none;background:none;padding:0;text-align:left;font-size:13.5px;font-weight:600;line-height:1.35;cursor:pointer}
.ins li button:hover{color:var(--accent)}
.ins small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

.cta{background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg);padding:var(--s5);display:flex;gap:var(--s4);align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta p{margin:0;color:var(--text-2);font-size:14px;max-width:560px}

/* ---------- Section/feed page ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.page-h h1{font-family:var(--serif);font-size:var(--fs-page);margin:0;line-height:1.15}
.page-h p{margin:var(--s1) 0 0;color:var(--muted);font-size:13.5px;max-width:560px}
.filters{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s5);padding-bottom:var(--s4);border-bottom:1px solid var(--border)}
.filters .select{width:auto;min-width:140px;height:32px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.stack{display:grid;gap:var(--s5)}
.stack .hcard{grid-template-columns:200px 1fr;padding-bottom:var(--s5);border-bottom:1px solid var(--border)}
.stack .hcard h3{font-size:var(--fs-headline)}
.stack .hcard p{-webkit-line-clamp:3;font-size:14px}

.empty{text-align:center;padding:var(--s12) var(--s4);border:1px dashed var(--border);border-radius:var(--r-lg);background:var(--surface)}
.empty svg{width:44px;height:44px;color:var(--secondary)}
.empty h3{margin:var(--s3) 0 var(--s1);font-size:16px}
.empty p{margin:0 auto var(--s4);color:var(--muted);font-size:14px;max-width:420px}

/* ---------- Settings / sources ---------- */
.set-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s4)}
.set-sec h2{margin:0 0 var(--s1);font-size:15px}
.set-sec > p{margin:0 0 var(--s4);color:var(--muted);font-size:13px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--border);flex-wrap:wrap}
.set-row:first-of-type{border-top:none}
.set-row label{font-size:14px;font-weight:500}
.srcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.srow b{font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12px}
.srow .r{display:flex;gap:6px;flex:0 0 auto}

/* ---------- Article reader (dialog) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:50;display:none}
.scrim.open{display:block}
.reader{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:60;box-shadow:var(--shadow-2);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.reader.open{transform:none}
.reader-bar{display:flex;align-items:center;gap:var(--s2);height:56px;padding:0 var(--s4);border-bottom:1px solid var(--border);flex:0 0 auto}
.reader-bar .sp{flex:1}
.reader-body{overflow-y:auto;padding:var(--s8) var(--s10) var(--s12)}
.reader .thumb{aspect-ratio:21/9;margin-bottom:var(--s6)}
.reader h1{font-family:var(--serif);font-size:calc(32px*var(--reader-scale));line-height:1.18;margin:var(--s3) 0 var(--s3);letter-spacing:-.2px}
.reader .byline{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;color:var(--muted);font-size:13px;padding-bottom:var(--s5);border-bottom:1px solid var(--border)}
.reader .byline b{color:var(--text)}
.ai-box{margin:var(--s6) 0;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:var(--s4) var(--s5);background:var(--surface-2)}
.ai-box .hd{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.ai-box .hd b{font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.ai-box p{margin:0;font-family:var(--serif);font-size:calc(19px*var(--reader-scale));line-height:1.6;color:var(--text)}
.ai-box small{display:block;margin-top:var(--s3);color:var(--muted);font-size:12px}
.reader .orig{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s4) var(--s5);border:1px solid var(--border);border-radius:var(--r-md);flex-wrap:wrap}
.reader .orig p{margin:0;font-size:13.5px;color:var(--text-2)}
.reader h2.rh{font-size:var(--fs-section);font-weight:700;letter-spacing:.9px;text-transform:uppercase;margin:var(--s10) 0 var(--s3);border-top:2px solid var(--text);padding-top:var(--s2)}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--surface-2) 60%,var(--surface)) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-md)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.reader{transition:none}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-md);font-size:13px;font-weight:600;opacity:0;transition:all .2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Bottom nav (mobile) ---------- */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{border:none;background:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.bnav button[aria-current="page"]{color:var(--primary)}
.bnav .icon{width:22px;height:22px}
.unused-demo-flag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning);font-size:11px;font-weight:700;letter-spacing:.5px}


.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b3d91,#071f4d);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow-1);flex:0 0 auto}
.m-brand .logo-mark{width:30px;height:30px;font-size:17px;border-radius:9px}
/* featured editorial block */
.feature-wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.feature-wrap .thumb{border:none;border-radius:0;aspect-ratio:auto;min-height:340px;height:100%}
.feature-wrap .fbody{padding:var(--s8) var(--s8) var(--s6);display:flex;flex-direction:column;gap:var(--s3)}
.feature-wrap .kick{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.feature-wrap h3{margin:0;font-family:var(--serif);font-size:30px;line-height:1.18;font-weight:700;letter-spacing:-.3px}
.feature-wrap h3 button{all:unset;cursor:pointer}
.feature-wrap h3 button:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.feature-wrap h3 button:focus-visible{box-shadow:var(--focus);border-radius:4px}
.feature-wrap p{margin:0;font-size:15.5px;line-height:1.6;color:var(--text-2)}
.feature-wrap .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding-top:var(--s4);border-top:1px solid var(--border)}
.feature-wrap .meta{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-meta);color:var(--muted);flex-wrap:wrap}
.feature-wrap .meta b{color:var(--text-2);font-weight:600}
.feature-wrap .acts{display:flex;gap:2px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s5);margin-top:var(--s5)}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s3) var(--s3) var(--s3);box-shadow:var(--shadow-1);transition:box-shadow .2s,border-color .2s}
.box:hover{box-shadow:0 4px 18px rgba(23,36,51,.09);border-color:color-mix(in srgb,var(--secondary) 35%,var(--border))}
[data-theme="dark"] .box:hover{box-shadow:0 4px 18px rgba(0,0,0,.45)}
.box .thumb{border:none}
.box h3{font-size:16.5px}
.thumb{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--surface)) 0%,color-mix(in srgb,var(--c) 8%,var(--surface)) 100%)}
@media (max-width:1000px){.feature-wrap{grid-template-columns:1fr}.feature-wrap .thumb{min-height:0;aspect-ratio:2/1}.cards3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.feature-wrap .fbody{padding:var(--s5)}.feature-wrap h3{font-size:23px}.cards3{grid-template-columns:1fr}}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .rail{position:fixed;right:0;top:0;width:320px;z-index:45;background:var(--surface);box-shadow:var(--shadow-2);transform:translateX(100%);transition:transform .25s}
  .rail.open{transform:none}
  .rail-toggle{display:inline-flex}
  .rail-close{display:flex}
}
@media (max-width:1000px){.insights{grid-template-columns:repeat(2,minmax(0,1fr))}.top-grid{grid-template-columns:1fr}.top-side{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .bnav{display:block}
  body{padding-bottom:72px}
  .topbar .in{padding:0 var(--s4);height:56px}
  .m-brand{display:flex;align-items:center;gap:8px}
  .m-brand .brand-name{font-size:14px}
  .content{padding:var(--s4)}
  .briefing{grid-template-columns:1fr;padding:var(--s4)}
  .briefing .lead{border-right:none;padding-right:0;border-bottom:1px solid var(--border);padding-bottom:var(--s4)}
  .blist li{grid-template-columns:1fr;gap:2px}
  .list{grid-template-columns:1fr}
  .top-side{grid-template-columns:1fr}
  .stack .hcard{grid-template-columns:110px 1fr}
  .srcs{grid-template-columns:1fr}
  .reader-body{padding:var(--s5) var(--s4) var(--s12)}
  .greet h1,.page-h h1{font-size:24px}
  .card.feature h3{font-size:22px}
  .hide-m{display:none}
  .searchbox{max-width:none}
  #railBtn{display:none}
}
@media (max-width:520px){
  .m-brand .brand-name{display:none}
  .insights{grid-template-columns:1fr}
  .hcard{grid-template-columns:96px 1fr}
}

function metaLine(i){return '<div class="meta"><b>'+esc(i.source)+'</b><span aria-hidden="true">·</span><time datetime="'+esc(i.date)+'">'+esc(rel(i.date))+'</time></div>'}
function badges(i){return (i.isNew?'<span class="badge new">'+L("new")+'</span>':"")+(i.star?'<span class="badge region">'+L("regionBadge")+'</span>':"")+'<span class="badge" title="'+L("language")+'">'+esc(i.lang||"")+'</span>'}
function actions(i){const sv=S.saved.includes(i.id);return '<div class="acts"><button class="iconbtn" data-save="'+i.id+'" aria-pressed="'+sv+'" aria-label="'+(sv?L("unsave"):L("save"))+'" title="'+(sv?L("unsave"):L("save"))+'">'+ic("bookmark","icon",sv)+'</button><button class="iconbtn" data-copy="'+esc(i.url)+'" aria-label="'+L("share")+'" title="'+L("share")+'">'+ic("link")+'</button></div>'}
function card(i,variant=""){
  const read=S.history.includes(i.id);const lang=i.lang==="TR"?"tr":"en";
  if(variant==="h"){return '<article class="card hcard'+(read?" read":"")+'">'+thumb(i,false)+'<div class="card" style="gap:6px"><div class="meta-top"><span class="tag" style="--c:'+SEGVAR[i.seg]+'">'+L(i.seg)+'</span>'+badges(i)+'</div><h3 lang="'+lang+'"><button data-open="'+i.id+'">'+esc(i.title)+'</button></h3><p lang="'+lang+'">'+esc(i.summary)+'</p><div class="row">'+metaLine(i)+actions(i)+'</div></div></article>'}
  return '<article class="card '+variant+(read?" read":"")+'">'+thumb(i)+'<div class="meta-top"><span class="tag" style="--c:'+SEGVAR[i.seg]+'">'+L(i.seg)+'</span>'+badges(i)+'</div><h3 lang="'+lang+'"><button data-open="'+i.id+'">'+esc(i.title)+'</button></h3><p lang="'+lang+'">'+esc(i.summary)+'</p><div class="row">'+metaLine(i)+actions(i)+'</div></article>';
}
function secH(title,moreView){return '<div class="sec-h"><h2>'+esc(title)+'</h2>'+(moreView?'<button class="more" data-view="'+moreView+'">'+L("seeAll")+' →</button>':"")+'</div>'}
function emptyState(icon,h,p,btnLbl,btnAttr){return '<div class="empty">'+ic(icon)+'<h3>'+esc(h)+'</h3><p>'+esc(p)+'</p>'+(btnLbl?'<button class="btn primary" '+btnAttr+'>'+esc(btnLbl)+'</button>':"")+'</div>'}

/* ---------- views ---------- */
function viewToday(){
  const items=visible().sort(byDate);
  const h=new Date().getHours();const g=h<12?L("morning"):h<18?L("afternoon"):L("evening");
  let html='<div class="greet"><div><h1>'+esc(g)+(S.name?", "+esc(S.name):"")+'</h1><p>'+esc(new Intl.DateTimeFormat(L("locale"),{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:TZ}).format(new Date()))+'</p></div><span class="updated"><i></i>'+L("updated")+' '+esc(updatedStr())+'</span></div>';
  // 3. Briefing
  const nNew=items.filter(i=>i.isNew).length,nReg=items.filter(i=>i.star).length;
  const rows=SEGS.filter(s=>!S.hiddenSegs.includes(s)).map(s=>{const top=items.find(i=>i.seg===s&&pDate(i.date))||items.find(i=>i.seg===s);return top?'<li><span class="tag" style="--c:'+SEGVAR[s]+'">'+L(s)+'</span><button data-open="'+top.id+'" lang="'+(top.lang==="TR"?"tr":"en")+'">'+esc(top.title)+'</button></li>':""}).join("");
  html+='<section class="briefing" aria-labelledby="bH"><div class="lead"><div class="kick">'+L("briefingKick")+'</div><h2 id="bH">'+L("briefing")+'</h2><p>'+L("briefingTxt")+'</p><div class="stats"><div><b>'+items.length+'</b><span>'+L("stories")+'</span></div><div><b>'+nNew+'</b><span>'+L("newLbl")+'</span></div><div><b>'+nReg+'</b><span>'+L("regionLbl")+'</span></div></div></div><ul class="blist">'+rows+'</ul></section>';
  // 4. Top stories (1 feature + 2)
  const dated=items.filter(i=>pDate(i.date));
  const top=dated.slice(0,4);
  if(top.length){const f=top[0],fl=f.lang==="TR"?"tr":"en";
    html+=secH(L("top"))+'<article class="feature-wrap'+(S.history.includes(f.id)?" read":"")+'">'+thumb(f)+'<div class="fbody"><div class="meta-top" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="kick">'+L(f.seg)+'</span>'+badges(f)+'</div><h3 lang="'+fl+'"><button data-open="'+f.id+'">'+esc(f.title)+'</button></h3><p lang="'+fl+'">'+esc(f.summary)+'</p><div class="row">'+metaLine(f)+actions(f)+'</div></div></article>'+
    (top.length>1?'<div class="cards3">'+top.slice(1).map(i=>card(i,"box")).join("")+'</div>':"")}
  // 5. Latest
  const used=new Set(top.map(i=>i.id));
  const latest=items.filter(i=>!used.has(i.id)).slice(0,6);latest.forEach(i=>used.add(i.id));
  if(latest.length)html+=secH(L("latest"),"all")+'<div class="list">'+latest.map(i=>card(i,"h")).join("")+'</div>';
  // 6. Trending (inline on small screens; rail on desktop)
  html+=secH(L("trending"))+'<div class="chips">'+TRENDING.map(([t,n])=>'<button class="pill" data-topic="'+esc(t)+'">'+esc(t)+' <span style="color:var(--muted)">'+n+'</span></button>').join("")+'</div>';
  // 7. Industry insights
  html+=secH(L("insights"))+'<div class="insights">'+SEGS.filter(s=>s!=="corp"&&!S.hiddenSegs.includes(s)).map(s=>{const its=items.filter(i=>i.seg===s).slice(0,3);return '<div class="ins"><h4><span class="nav-dot" style="--c:'+SEGVAR[s]+';margin:0"></span><button data-view="'+s+'">'+L(s)+' →</button></h4><ul>'+its.map(i=>'<li><button data-open="'+i.id+'" lang="'+(i.lang==="TR"?"tr":"en")+'">'+esc(i.title)+'</button><small>'+esc(i.source)+' · '+esc(rel(i.date))+'</small></li>').join("")+'</ul></div>'}).join("")+'</div>';
  // 8. Recommended
  html+=secH(L("recommended"),S.follow.length||S.followPubs.length?"myfeed":null);
  const rec=recommend(4);
  html+=rec.list.length?'<p style="margin:-4px 0 12px;color:var(--muted);font-size:12.5px">'+L("recWhy")+' '+rec.why+'</p><div class="list">'+rec.list.map(i=>card(i,"h")).join("")+'</div>':'<div class="cta"><p>'+L("recEmpty")+'</p><button class="btn primary" data-view="settings">'+L("recBtn")+'</button></div>';
  html+='<p style="margin:40px 0 0;color:var(--muted);font-size:12px">'+L("aboutFoot")+'</p>';
  return html;
}
function recommend(n){
  const readSegs={};S.history.forEach(id=>{const i=ITEMS.find(x=>x.id===id);if(i)readSegs[i.seg]=(readSegs[i.seg]||0)+1});
  S.saved.forEach(id=>{const i=ITEMS.find(x=>x.id===id);if(i)readSegs[i.seg]=(readSegs[i.seg]||0)+2});
  const hasSignal=S.follow.length||S.followPubs.length||Object.keys(readSegs).length;
  if(!hasSignal)return {list:[],why:""};
  const score=i=>(S.follow.includes(i.seg)?5:0)+(S.followPubs.includes(i.source)?4:0)+(readSegs[i.seg]||0)+(i.isNew?1:0);
  const list=visible().filter(i=>!S.history.includes(i.id)).map(i=>[i,score(i)]).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]||byDate(a[0],b[0])).slice(0,n).map(x=>x[0]);
  const why=[S.follow.length||S.followPubs.length?L("recWhyFollow"):null,Object.keys(readSegs).length?L("recWhyRead"):null].filter(Boolean).join(" + ");
  return {list,why};
}
function filterBar(showSeg){
  return '<div class="filters" role="group" aria-label="Filters"><div class="seg" role="group" aria-label="'+L("region")+'">'+[["all",L("all")],["global",L("global")],["tr",L("turkiye")]].map(([k,l])=>'<button data-freg="'+k+'" aria-pressed="'+(S.fReg===k)+'">'+esc(l)+'</button>').join("")+'</div>'+
  (showSeg?'<label class="sr-only" for="fSeg">'+L("category")+'</label><select class="select" id="fSeg"><option value="all">'+L("category")+': '+L("all")+'</option>'+SEGS.map(s=>'<option value="'+s+'"'+(S.fSeg===s?" selected":"")+'>'+L(s)+'</option>').join("")+'</select>':"")+
  '<label class="sr-only" for="fPub">'+L("publisher")+'</label><select class="select" id="fPub"><option value="">'+L("allPublishers")+'</option>'+PUBS.map(p=>'<option'+(S.fPub===p?" selected":"")+'>'+esc(p)+'</option>').join("")+'</select>'+
  '<label class="sr-only" for="fDate">'+L("dateF")+'</label><select class="select" id="fDate">'+[["any",L("any")],["7",L("d7")],["30",L("d30")]].map(([k,l])=>'<option value="'+k+'"'+(S.fDate===k?" selected":"")+'>'+esc(l)+'</option>').join("")+'</select></div>';
}
function applyFilters(list){
  return list.filter(i=>(S.fReg==="all"||i.reg===S.fReg)&&(!S.fPub||i.source===S.fPub)&&(S.fSeg==="all"||i.seg===S.fSeg)&&(S.fDate==="any"||(pDate(i.date)&&(Date.now()-ts(i))<=(+S.fDate)*864e5)));
}
function listPage(title,desc,list,opts={}){
  const filtered=applyFilters(list).sort(byDate);
  let html='<div class="page-h"><div><h1>'+esc(title)+'</h1>'+(desc?'<p>'+esc(desc)+'</p>':"")+'</div>'+(opts.head||"")+'</div>'+filterBar(opts.segFilter);
  if(!filtered.length)return html+emptyState("search",L("noResults"),L("noResultsTip"),L("clear"),'data-clearf="1"');
  html+='<div class="stack">'+filtered.slice(0,S.limit).map(i=>card(i,"h")).join("")+'</div>';
  if(filtered.length>S.limit)html+='<div style="text-align:center;margin-top:24px"><button class="btn" data-more="1">'+L("showMore")+' ('+(filtered.length-S.limit)+')</button></div>';
  return html;
}
function followBtns(seg){const f=S.follow.includes(seg),h=S.hiddenSegs.includes(seg);return '<div style="display:flex;gap:8px"><button class="btn'+(f?"":" primary")+'" data-follow="'+seg+'" aria-pressed="'+f+'">'+(f?"✓ "+L("following"):"+ "+L("follow"))+'</button><button class="btn" data-hide="'+seg+'" aria-pressed="'+h+'">'+(h?L("hidden"):L("hide"))+'</button></div>'}
function viewSettings(){
  const tzOpts=TZ;
  let html='<div class="page-h"><div><h1>'+L("settingsH")+'</h1><p>'+L("settingsP")+'</p></div></div>';
  html+='<section class="set-sec"><h2>'+L("appearance")+'</h2><p></p>'+
   '<div class="set-row"><label>'+L("theme")+'</label><div class="seg">'+[["light",L("light")],["dark",L("dark")],["system",L("system")]].map(([k,l])=>'<button data-theme="'+k+'" aria-pressed="'+(S.themePref===k)+'">'+esc(l)+'</button>').join("")+'</div></div>'+
   '<div class="set-row"><label for="langSel">'+L("langSet")+'</label><select class="select" id="langSel" style="width:auto">'+Object.keys(I18N).map(k=>'<option value="'+k+'"'+(S.lang===k?" selected":"")+'>'+I18N[k]._name+'</option>').join("")+'</select></div>'+
   '<div class="set-row"><label>'+L("tz")+'</label><span style="color:var(--muted);font-size:14px">'+esc(tzOpts)+'</span></div></section>';
  html+='<section class="set-sec"><h2>'+L("you")+'</h2><p></p><div class="set-row"><label for="nameIn">'+L("nameLbl")+'</label><input class="input" id="nameIn" style="max-width:260px" placeholder="'+L("namePh")+'" value="'+esc(S.name)+'"></div></section>';
  html+='<section class="set-sec"><h2>'+L("interests")+'</h2><p>'+L("interestsP")+'</p>'+SEGS.map(s=>'<div class="set-row"><label><span class="tag" style="--c:'+SEGVAR[s]+'">'+L(s)+'</span></label>'+followBtns(s)+'</div>').join("")+'</section>';
  html+='<section class="set-sec"><h2>'+L("pubs")+'</h2><p></p><div class="chips">'+PUBS.map(p=>'<button class="pill" data-fpub="'+esc(p)+'" aria-pressed="'+S.followPubs.includes(p)+'">'+esc(p)+'</button>').join("")+'</div></section>';
  const hist=S.history.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean).reverse();
  html+='<section class="set-sec"><h2>'+L("history")+'</h2><p>'+L("historyP")+'</p>'+(hist.length?'<ul class="rlist">'+hist.slice(0,10).map(i=>'<li><span class="n">·</span><div><button data-open="'+i.id+'">'+esc(i.title)+'</button><small>'+esc(i.source)+'</small></div></li>').join("")+'</ul><div style="margin-top:12px"><button class="btn" data-clearhist="1">'+L("clearHistBtn")+'</button></div>':'<p style="color:var(--muted);font-size:13.5px;margin:0">'+L("noHistory")+'</p>')+'</section>';
  return html;
}
function viewSources(){
  let html='<div class="page-h"><div><h1>'+L("sourcesH")+'</h1><p>'+L("sourcesP")+'</p></div></div>';
  SOURCES.forEach(g=>{html+=secH(g.g.replace(/^\S+\s/,""))+'<div class="srcs">'+g.items.map(s=>'<div class="srow"><div><b>'+esc(s.n)+'</b><small>'+esc(s.d)+'</small></div><div class="r"><a class="btn sm" href="'+esc(s.w)+'" target="_blank" rel="noopener">'+ic("globe","icon")+L("site")+'</a>'+(s.li?'<a class="btn sm" href="'+esc(liUrl(s.li))+'" target="_blank" rel="noopener" aria-label="LinkedIn: '+esc(s.n)+'">in</a>':"")+'</div></div>').join("")+'</div>'});
  return html;
}
function liUrl(li){return li.startsWith("q:")?"https://www.linkedin.com/search/results/companies/?keywords="+encodeURIComponent(li.slice(2)):li}
function viewDiscover(){
  let html='<div class="page-h"><div><h1>'+L("nav_discover")+'</h1></div></div>';
  html+='<div class="insights" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">'+SEGS.concat(["region"]).map(s=>{const n=s==="region"?ITEMS.filter(i=>i.star).length:ITEMS.filter(i=>i.seg===s).length;const c=s==="region"?"var(--warning)":SEGVAR[s];return '<button class="set-sec" style="text-align:left;cursor:pointer;margin:0;border-left:3px solid '+c+'" data-view="'+s+'"><b style="font-size:15px">'+L(s==="region"?"nav_region":s)+'</b><div style="color:var(--muted);font-size:13px;margin-top:4px">'+L(s+"_d")+'</div><div style="margin-top:10px;font-size:12px;font-weight:600;color:var(--text-2)">'+fmt("storiesN",{n})+'</div></button>'}).join("")+'</div>';
  html+=secH(L("trending"))+'<div class="chips">'+TRENDING.map(([t,n])=>'<button class="pill" data-topic="'+esc(t)+'">'+esc(t)+' <span style="color:var(--muted)">'+n+'</span></button>').join("")+'</div>';
  html+=secH(L("nav_sources"),"sources")+'<p style="color:var(--muted);font-size:13.5px;margin:0">'+L("sourcesP")+'</p>';
  return html;

function viewSearch(){
  const q=S.q.toLocaleLowerCase("tr");const list=ITEMS.filter(i=>textOf(i).includes(q));
  return listPage('“'+S.q+'”',fmt("storiesN",{n:applyFilters(list).length}),list,{segFilter:true});
}
function renderView(){
  const v=S.view;let html="";
  if(v==="today")html=viewToday();
  else if(SEGS.includes(v))html=listPage(L(v),L(v+"_d"),ITEMS.filter(i=>i.seg===v),{head:followBtns(v)});
  else if(v==="region")html=listPage(L("nav_region"),L("region_d"),ITEMS.filter(i=>i.star));
  else if(v==="all")html=listPage(L("latest"),"",visible(),{segFilter:true});
  else if(v==="myfeed"){const list=ITEMS.filter(i=>S.follow.includes(i.seg)||S.followPubs.includes(i.source));html=(S.follow.length||S.followPubs.length)?listPage(L("nav_myfeed"),"",list,{segFilter:true}):'<div class="page-h"><div><h1>'+L("nav_myfeed")+'</h1></div></div>'+emptyState("myfeed",L("emptyFeed"),L("emptyFeedTip"),L("recBtn"),'data-view="settings"')}
  else if(v==="saved"){const list=S.saved.map(id=>ITEMS.find(i=>i.id===id)).filter(Boolean);html=list.length?listPage(L("nav_saved"),"",list,{segFilter:true}):'<div class="page-h"><div><h1>'+L("nav_saved")+'</h1></div></div>'+emptyState("bookmark",L("emptySaved"),L("emptySavedTip"),L("browse"),'data-view="today"')}
  else if(v==="sources")html=viewSources();
  else if(v==="settings")html=viewSettings();
  else if(v==="discover")html=viewDiscover();
  else if(v==="search")html=viewSearch();
  $("main").innerHTML=html;
}

/* ---------- article reader ---------- */
function renderReader(){
  const i=ITEMS.find(x=>x.id===S.readerId);if(!i)return;
  const lang=i.lang==="TR"?"tr":"en";const sv=S.saved.includes(i.id);
  const related=ITEMS.filter(x=>x.id!==i.id&&x.seg===i.seg).sort(byDate).slice(0,3);
  const kws=TOPICS.filter(t=>textOf(i).includes(t.toLocaleLowerCase("tr")));
  const coverage=ITEMS.filter(x=>x.id!==i.id&&!related.includes(x)&&kws.some(t=>textOf(x).includes(t.toLocaleLowerCase("tr")))).sort(byDate).slice(0,3);
  document.documentElement.style.setProperty("--reader-scale",S.readerScale);
  $("reader").innerHTML='<div class="reader-bar"><button class="iconbtn" id="rClose" aria-label="'+L("close")+'">'+ic("close")+'</button><span class="sp"></span>'+
   '<button class="btn sm ghost" data-scale="-1" aria-label="'+L("fontDown")+'">A−</button><button class="btn sm ghost" data-scale="1" aria-label="'+L("fontUp")+'">A+</button>'+
   '<button class="btn sm" data-save="'+i.id+'" aria-pressed="'+sv+'">'+ic("bookmark","icon",sv)+(sv?L("saved"):L("save"))+'</button><button class="btn sm" data-copy="'+esc(i.url)+'">'+ic("link")+'<span class="hide-m">'+L("share")+'</span></button></div>'+
   '<div class="reader-body">'+thumb(i)+'<div class="meta-top" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag" style="--c:'+SEGVAR[i.seg]+'">'+L(i.seg)+'</span>'+badges(i)+'</div>'+
   '<h1 id="rTitle" lang="'+lang+'">'+esc(i.title)+'</h1>'+
   '<div class="byline"><span><b>'+esc(i.source)+'</b></span><span>'+L("published")+': '+esc(fullDate(i.date))+'</span><span>'+L("region")+': '+(i.reg==="tr"?L("turkiye"):L("global"))+'</span><span>'+L("language")+': '+esc(i.lang||"")+'</span></div>'+
   '<div class="ai-box"><div class="hd"><span class="badge ai">AI</span><b>'+L("aiLabel")+'</b></div><p lang="'+lang+'">'+esc(i.summary)+'</p><small>'+L("aiNote")+'</small></div>'+
   '<div class="orig"><p>'+L("origNote")+'</p><a class="btn primary" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+L("readOrig")+' '+ic("ext")+'</a></div>'+
   (related.length?'<h2 class="rh">'+L("related")+'</h2><div class="stack">'+related.map(x=>card(x,"h")).join("")+'</div>':"")+
   (coverage.length?'<h2 class="rh">'+L("coverage")+'</h2><div class="stack">'+coverage.map(x=>card(x,"h")).join("")+'</div>':"")+
   '</div>';
}
let lastFocus=null;
function openReader(id){
  lastFocus=document.activeElement;S.readerId=id;
  if(!S.history.includes(id)){S.history=[...S.history,id].slice(-200);store.set("history",S.history)}
  renderReader();$("reader").classList.add("open");$("reader").setAttribute("aria-hidden","false");$("scrim").classList.add("open");document.body.style.overflow="hidden";
  $("reader").querySelector(".reader-body").scrollTop=0;setTimeout(()=>{const c=$("rClose");c&&c.focus()},50);
  renderRail();
}
function closeReader(){S.readerId=null;$("reader").classList.remove("open");$("reader").setAttribute("aria-hidden","true");$("scrim").classList.remove("open");document.body.style.overflow="";renderView();if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}

/* ---------- search suggestions ---------- */
let sgIdx=-1;
function renderSuggest(){
  const box=$("suggest");const q=$("q").value.trim().toLocaleLowerCase("tr");let html="";
  if(!q){
    if(S.searchHist.length)html+='<h6>'+L("recent")+' <button class="btn sm ghost" data-clearsh="1" style="float:right;height:20px">'+L("clearHist")+'</button></h6>'+S.searchHist.slice(0,5).map(s=>'<button class="sg" role="option" data-sq="'+esc(s)+'">'+ic("clock")+esc(s)+'</button>').join("");
    html+='<h6>'+L("trending")+'</h6>'+TRENDING.slice(0,6).map(([t,n])=>'<button class="sg" role="option" data-sq="'+esc(t)+'">'+ic("tag")+esc(t)+'<small>'+fmt("storiesN",{n})+'</small></button>').join("");
  }else{
    const st=ITEMS.filter(i=>textOf(i).includes(q)).sort(byDate).slice(0,5);
    const tp=TOPICS.filter(t=>t.toLocaleLowerCase("tr").includes(q)).slice(0,3);
    const pb=PUBS.filter(p=>p.toLocaleLowerCase("tr").includes(q)).slice(0,3);
    if(st.length)html+='<h6>'+L("suggestions")+'</h6>'+st.map(i=>'<button class="sg" role="option" data-open="'+i.id+'">'+ic("search")+'<span>'+esc(i.title)+'</span><small>'+esc(i.source)+'</small></button>').join("");
    if(tp.length)html+='<h6>'+L("topics")+'</h6>'+tp.map(t=>'<button class="sg" role="option" data-sq="'+esc(t)+'">'+ic("tag")+esc(t)+'</button>').join("");
    if(pb.length)html+='<h6>'+L("publishers")+'</h6>'+pb.map(p=>'<button class="sg" role="option" data-spub="'+esc(p)+'">'+ic("sources")+esc(p)+'</button>').join("");
    if(!html)html='<div style="padding:12px;color:var(--muted);font-size:13.5px">'+L("noResults")+' — '+esc($("q").value)+'</div>';
  }
  box.innerHTML=html;box.classList.add("open");$("q").setAttribute("aria-expanded","true");sgIdx=-1;
}
function closeSuggest(){$("suggest").classList.remove("open");$("q").setAttribute("aria-expanded","false")}
function doSearch(q){q=q.trim();if(!q)return;S.q=q;$("q").value=q;S.searchHist=[q,...S.searchHist.filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,8);store.set("searchHist",S.searchHist);closeSuggest();go("search")}

/* ---------- navigation & events ---------- */
function resetFilters(){S.fReg="all";S.fPub="";S.fDate="any";S.fSeg="all";S.limit=10}
function go(view){if(S.readerId)closeReader();S.view=view;resetFilters();if(view!=="search"){S.q="";$("q").value=""}closeRail();render();window.scrollTo({top:0});$("main").focus({preventScroll:true})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function openRail(){$("rail").classList.add("open");$("railBtn").setAttribute("aria-expanded","true")}
function closeRail(){$("rail").classList.remove("open");$("railBtn").setAttribute("aria-expanded","false")}
function refreshAll(){renderSidebar();renderRail();renderView();if(S.readerId)renderReader();renderTop()}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open],[data-view],[data-save],[data-copy],[data-topic],[data-sq],[data-spub],[data-follow],[data-hide],[data-fpub],[data-freg],[data-theme],[data-more],[data-clearf],[data-clearhist],[data-clearsh],[data-scale]");
  if(!el){if(!e.target.closest(".searchbox"))closeSuggest();return}
  const d=el.dataset;
  if(d.open){e.preventDefault();closeSuggest();openReader(d.open);return}
  if(d.view){e.preventDefault();go(d.view);return}
  if(d.save){const on=S.saved.includes(d.save);S.saved=on?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];store.set("saved",S.saved);toast(on?L("removed"):L("added"));refreshAll();return}
  if(d.copy){const u=d.copy;const done=()=>toast(L("copied"));try{navigator.clipboard.writeText(u).then(done,()=>toast(u))}catch(err){toast(u)}return}
  if(d.topic){doSearch(d.topic);return}
  if(d.sq){doSearch(d.sq);return}
  if(d.spub){closeSuggest();S.view="all";resetFilters();S.fPub=d.spub;$("q").value="";render();return}
  if(d.follow){S.follow=S.follow.includes(d.follow)?S.follow.filter(x=>x!==d.follow):[...S.follow,d.follow];store.set("follow",S.follow);refreshAll();return}
  if(d.hide){S.hiddenSegs=S.hiddenSegs.includes(d.hide)?S.hiddenSegs.filter(x=>x!==d.hide):[...S.hiddenSegs,d.hide];store.set("hidden",S.hiddenSegs);refreshAll();return}
  if(d.fpub){S.followPubs=S.followPubs.includes(d.fpub)?S.followPubs.filter(x=>x!==d.fpub):[...S.followPubs,d.fpub];store.set("followPubs",S.followPubs);renderView();return}
  if(d.freg){S.fReg=d.freg;S.limit=10;renderView();return}
  if(d.theme){S.themePref=d.theme;store.set("theme",S.themePref);render();return}
  if(d.more){S.limit+=10;renderView();return}
  if(d.clearf){resetFilters();renderView();return}
  if(d.clearhist){S.history=[];store.set("history",[]);refreshAll();return}
  if(d.clearsh){e.stopPropagation();S.searchHist=[];store.set("searchHist",[]);renderSuggest();return}
  if(d.scale){S.readerScale=Math.min(1.3,Math.max(.85,+(S.readerScale+(+d.scale)*.075).toFixed(3)));store.set("scale",S.readerScale);document.documentElement.style.setProperty("--reader-scale",S.readerScale);return}
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fPub"){S.fPub=e.target.value;S.limit=10;renderView()}
  if(id==="fDate"){S.fDate=e.target.value;S.limit=10;renderView()}
  if(id==="fSeg"){S.fSeg=e.target.value;S.limit=10;renderView()}
  if(id==="langSel"){S.lang=e.target.value;store.set("lang",S.lang);render()}
});
document.addEventListener("input",e=>{if(e.target.id==="nameIn"){S.name=e.target.value.trim().slice(0,40);store.set("name",S.name)}});
$("q").addEventListener("focus",renderSuggest);
$("q").addEventListener("input",renderSuggest);
$("q").addEventListener("keydown",e=>{
  const opts=[...$("suggest").querySelectorAll(".sg")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!opts.length)return;sgIdx=(sgIdx+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;opts.forEach((o,k)=>o.classList.toggle("active",k===sgIdx));opts[sgIdx].scrollIntoView({block:"nearest"});return}
  if(e.key==="Enter"){e.preventDefault();if(sgIdx>=0&&opts[sgIdx])opts[sgIdx].click();else doSearch($("q").value);return}
  if(e.key==="Escape"){closeSuggest();$("q").blur()}
});
$("langBtn").addEventListener("click",()=>{S.lang=S.lang==="en"?"tr":"en";store.set("lang",S.lang);render()});
$("themeBtn").addEventListener("click",()=>{S.themePref=document.documentElement.dataset.theme==="dark"?"light":"dark";store.set("theme",S.themePref);render()});
$("railBtn").addEventListener("click",()=>{$("rail").classList.contains("open")?closeRail():openRail()});
$("rail").addEventListener("click",e=>{if(e.target.closest("#railClose"))closeRail()});
$("scrim").addEventListener("click",closeReader);
$("reader").addEventListener("click",e=>{if(e.target.closest("#rClose"))closeReader()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(S.readerId)closeReader();else closeRail()}
  if(e.key==="/"&&!/input|select|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
  if(e.key==="Tab"&&S.readerId){const f=[...$("reader").querySelectorAll("button,a[href]")];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.themePref==="system")render()})}catch(e){}}
document.documentElement.style.setProperty("--reader-scale",S.readerScale);
render();
</script>
</body>
</html>
