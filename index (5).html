<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081733">
<title>NEWSPENGUEN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071430;--bg2:#0B1D42;--card:#0F2552;--card2:#13306A;--line:rgba(255,255,255,.08);
  --text:#F2F6FC;--text2:#B9C6DD;--muted:#7F90B0;--blue:#1E6BFF;--blue2:#3B82F6;--gold:#F5A623;
  --marine:#1E6BFF;--prot:#22A45D;--deco:#F59E0B;--powder:#8B5CF6;--energy:#E11D48;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#0E2350 0%,#071430 55%,#050E22 100%) fixed;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:10px}
.app{max-width:960px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.ic{width:20px;height:20px;flex:0 0 auto}

/* header */
.top{position:sticky;top:0;z-index:20;padding:14px 16px 10px;background:linear-gradient(180deg,rgba(7,20,48,.97) 70%,rgba(7,20,48,0));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:.4px;line-height:1.1}
.brand b sup{font-size:9px;font-weight:600;margin-left:1px}
.brand small{display:block;color:var(--text2);font-size:12px;margin-top:1px}
.logo{width:42px;height:42px;flex:0 0 auto}
.rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;position:relative}
.rb .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--bg)}
.av{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-weight:800;font-size:16px}
.pagetitle{font-size:24px;font-weight:800;margin:0;flex:1}
.back{width:38px;height:38px;display:grid;place-items:center;border-radius:12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.05);border:1px solid var(--line)}
.chip svg{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(30,107,255,.35)}
.chip .n{font-size:11.5px;opacity:.75}

main{padding:4px 16px 0}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.sec h2{margin:0;font-size:20px;font-weight:800}
.link{color:var(--text2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;height:300px;box-shadow:0 18px 40px rgba(0,0,0,.35);background:#0b1b3d}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s}
.slide.on{opacity:1;visibility:visible}
.slide .scene{position:absolute;inset:0}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,14,34,.95) 0%,rgba(5,14,34,.55) 50%,rgba(5,14,34,0) 80%)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 18px 34px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--c,var(--blue));color:#fff}
.cap h3{margin:10px 0 6px;font-size:24px;line-height:1.15;font-weight:800;padding-right:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap p{margin:0;color:var(--text2);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:44px}
.go{position:absolute;right:16px;bottom:38px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.dots{position:absolute;left:0;right:0;bottom:12px;z-index:3;display:flex;justify-content:center;gap:7px}
.dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots button[aria-current="true"]{background:#fff}

/* list cards */
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:118px 1fr 28px;gap:12px;align-items:center;padding:10px;border-radius:16px;background:linear-gradient(180deg,#EEF3FB,#E2E9F5);color:#0B1A36}
.item .scene{height:84px;border-radius:11px;overflow:hidden}
.item .b{min-width:0}
.item .tag{height:21px;font-size:11px;letter-spacing:0;text-transform:none;border-radius:999px;padding:0 9px}
.item h4{margin:6px 0 4px;font-size:15.5px;line-height:1.25;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{font-size:12px;color:#55647E;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.score{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:#9A5B00}
.star{color:#B45309;font-weight:800}
.bm{align-self:start;width:28px;height:28px;display:grid;place-items:center;color:#0B1A36}
.bm[aria-pressed="true"] svg{fill:currentColor}
.open{all:unset;cursor:pointer;display:contents}

/* sectors */
.secs{display:grid;gap:12px}
.sc{position:relative;height:118px;border-radius:18px;overflow:hidden;text-align:left;width:100%;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sc .scene{position:absolute;inset:0}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,transparent) 42%,transparent 75%);opacity:.92}
.sc .t{position:absolute;left:18px;top:16px;bottom:14px;right:40%;z-index:2;display:flex;flex-direction:column;gap:4px}
.sc b{font-size:20px;font-weight:800}
.sc span{font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.35}
.sc em{font-style:normal;font-size:12px;font-weight:700;margin-top:auto;opacity:.9}
.sc .arr{position:absolute;right:12px;bottom:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(5,14,34,.55);display:grid;place-items:center}

/* projects */
.seg3{display:flex;gap:8px;margin:4px 0 12px}
.seg3 button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.04)}
.seg3 button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.map{border-radius:18px;background:radial-gradient(90% 90% at 50% 50%,#10285A,#081A3E);border:1px solid var(--line);padding:6px;position:relative}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pcard{display:grid;grid-template-columns:86px 1fr 26px;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.pcard .scene{height:66px;border-radius:10px;overflow:hidden}
.pcard h4{margin:0 0 3px;font-size:14.5px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard small{display:block;color:var(--text2);font-size:12px}
.pcard .loc{color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:3px}
.pcard .bm{color:var(--text)}

/* article */
.ahero{position:relative;height:300px;margin:0 -16px;overflow:hidden}
.ahero .scene{position:absolute;inset:0}
.ahero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(7,20,48,.2) 55%,rgba(7,20,48,0) 100%)}
.ahero .cap{padding:16px}
.ahero h1{margin:10px 0 6px;font-size:25px;line-height:1.2;font-weight:800}
.ahero .m{color:var(--text2);font-size:13px}
.why{margin:16px 0;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(245,166,35,.16),rgba(245,166,35,.05));border:1px solid rgba(245,166,35,.35)}
.why .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#FFD38A;margin-bottom:6px}
.why .co{font-weight:800;margin:0 0 6px;font-size:15px}
.why p{margin:0;line-height:1.55;font-size:15px;color:var(--text)}
.body{font-size:16px;line-height:1.65;color:var(--text2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.facts small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.facts b{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--blue);font-weight:700;font-size:15px;box-shadow:0 10px 24px rgba(30,107,255,.35)}
.also{color:var(--text2);font-size:13.5px;margin:12px 0}
.also a{color:#8DB4FF}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#123170,#0B1F4B);border:1px solid var(--line)}
.prof .av{width:60px;height:60px;font-size:24px}
.prof b{display:block;font-size:18px}
.prof small{color:var(--text2)}
.rows{display:grid;gap:10px;margin-top:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.row b{display:block;font-size:14.5px}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row .chev{margin-left:auto;color:var(--muted)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;padding:4px 2px 2px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted);font-size:12px}

.empty{text-align:center;color:var(--text2);padding:40px 16px;border:1px dashed var(--line);border-radius:18px}
.foot{color:var(--muted);font-size:12px;margin:24px 0 8px;text-align:center}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,18,42,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 10px;gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--text2)}
.nav button[aria-current="page"]{background:var(--blue);color:#fff}
.nav svg{width:22px;height:22px}

@media (min-width:760px){
  .list{grid-template-columns:1fr 1fr}
  .secs{grid-template-columns:1fr 1fr}
  .hero{height:360px}
  .cap h3{font-size:30px}
  .ahero{margin:0;border-radius:22px;height:360px}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>

  const pool=vis();
  return '<div class="bar"><div class="brand">'+LOGO+'<div><b>NEWSPENGUEN<sup>®</sup></b><small>Industry &amp; Project Insights</small></div></div>'+right+'</div>'+
   '<nav class="chips" aria-label="Segmentler"><button class="chip" data-seg="all" aria-pressed="'+(S.seg==="all")+'">Tümü <span class="n">'+pool.length+'</span></button><button class="chip" data-seg="star" aria-pressed="'+(S.seg==="star")+'">★ Bölgem <span class="n">'+pool.filter(i=>i.star).length+'</span></button>'+SEGS.filter(s=>!S.hidden.includes(s)).map(s=>'<button class="chip" data-seg="'+s+'" aria-pressed="'+(S.seg===s)+'">'+ic(SEGI[s])+SEGN[s]+' <span class="n">'+pool.filter(i=>i.seg===s).length+'</span></button>').join("")+'</nav>';
}
function filtered(){const p=vis();return S.seg==="all"?p:S.seg==="star"?p.filter(i=>i.star):p.filter(i=>i.seg===S.seg)}
function viewHome(){
  const list=filtered().sort(byScore);
  if(!list.length)return '<div class="empty">Bu filtrede fırsat yok.</div>';
  const hero=list.slice(0,4);if(S.slide>=hero.length)S.slide=0;
  let h='<section class="hero" aria-roledescription="carousel" aria-label="Öne çıkan fırsatlar">'+hero.map((i,k)=>'<div class="slide'+(k===S.slide?" on":"")+'"'+(k===S.slide?"":' aria-hidden="true"')+'>'+scene(i.seg,i.id+"h")+'<div class="cap"><span class="tag" style="--c:'+(i.star?"#D97706":SEGC[i.seg])+'">'+(i.star?"★ Bölgem":(KIND[i.kind]||SEGN[i.seg]))+'</span><h3>'+esc(i.company||i.title)+'</h3><p>'+esc(i.why||i.summary)+'</p></div><button class="go" data-open="'+i.id+'" aria-label="Detayı aç"'+(k===S.slide?"":' tabindex="-1"')+'>'+ic("right")+'</button></div>').join("")+
   (hero.length>1?'<div class="dots">'+hero.map((_,k)=>'<button data-slide="'+k+'" aria-label="Fırsat '+(k+1)+'" aria-current="'+(k===S.slide)+'"></button>').join("")+'</div>':'')+'</section>';
  h+='<div class="sec"><h2>Güncel Fırsatlar</h2><button class="link" data-view="projects">Harita '+ic("right")+'</button></div><div class="list">'+list.slice(hero.length).sort(byDate).map(item).join("")+'</div>';
  h+='<p class="foot">Son güncelleme: '+esc(UPDATED)+' · Yalnızca 50+ satış potansiyeli puanlı fırsatlar</p>';
  return h;
}
function viewSectors(){
  return '<div class="secs">'+SEGS.map(s=>{const n=vis().filter(i=>i.seg===s);const top=n.sort(byScore)[0];return '<button class="sc" data-segview="'+s+'" style="--c:'+SEGC[s]+'">'+scene(s,"sec"+s)+'<span class="t"><b>'+SEGN[s]+'</b><span>'+SEGD[s]+'</span><em>'+n.length+' fırsat'+(top?' · en yüksek ★'+top.score:'')+'</em></span><span class="arr">'+ic("right")+'</span></button>'}).join("")+'</div>';
}
function viewProjects(){
  let list=vis().sort(byScore);
  if(S.proj==="run")list=list.filter(i=>!planned(i));if(S.proj==="plan")list=list.filter(planned);
  if(S.pin)list=list.filter(i=>i.id===S.pin).concat(list.filter(i=>i.id!==S.pin));
  return '<div class="seg3" role="group" aria-label="Proje durumu">'+[["all","Tümü"],["run","Devam Eden"],["plan","Planlanan"]].map(([k,l])=>'<button data-proj="'+k+'" aria-pressed="'+(S.proj===k)+'">'+l+'</button>').join("")+'</div><div class="map">'+mapSVG(list)+'</div><p style="color:var(--muted);font-size:12px;margin:8px 2px 14px">Turuncu çerçeve: Trakya · Turuncu iğne: bölge projesi. İğneye dokununca proje en üste gelir.</p><div class="list">'+(list.length?list.map(pcard).join(""):'<div class="empty">Proje yok.</div>')+'</div>';
}
function viewSaved(){const l=S.saved.map(get).filter(Boolean);return l.length?'<div class="list">'+l.map(item).join("")+'</div>':'<div class="empty">'+ic("bm")+'<p>Henüz kayıtlı fırsat yok. Kartlardaki yer imine dokunarak buraya ekleyebilirsin.</p></div>'}
function viewSearch(){return '<input id="q" type="search" placeholder="Şirket, şehir veya konu ara…" style="width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 16px;font-size:15px" value="'+esc(S.q||"")+'" aria-label="Ara"><div class="list" id="res" style="margin-top:14px"></div>'}
function viewProfile(){
  const p=vis();
  return '<div class="prof"><div class="av">R</div><div><b>Recep Kurnaz</b><small>Jotun · Satış Müdürü</small><br><small>İstanbul Avrupa Yakası + Trakya</small></div></div>'+
   '<div class="stat"><div><b>'+p.length+'</b><small>Fırsat</small></div><div><b>'+p.filter(i=>i.star).length+'</b><small>Bölgemde</small></div><div><b>'+p.filter(i=>i.kind==="tender").length+'</b><small>İhale</small></div></div>'+
   '<div class="rows"><div class="row" style="display:block"><div style="display:flex;align-items:center;gap:14px">'+ic("layers")+'<div><b>İlgi Alanlarım</b><small>Kapalı segmentler akışta görünmez</small></div></div><div class="toggles" style="margin-top:10px">'+SEGS.map(s=>'<button class="chip" data-hide="'+s+'" aria-pressed="'+!S.hidden.includes(s)+'">'+ic(SEGI[s])+SEGN[s]+'</button>').join("")+'</div></div>'+
   '<button class="row">'+ic("bell")+'<div><b>Bildirim Tercihleri</b><small>75+ bölge fırsatı ve 10 günden az kalan ihaleler</small></div><span class="chev">'+ic("chev")+'</span></button>'+
   '<button class="row">'+ic("pin")+'<div><b>Bölge Ayarları</b><small>İstanbul Avrupa Yakası, Tekirdağ, Kırklareli, Edirne</small></div><span class="chev">'+ic("chev")+'</span></button>'+
   '<button class="row">'+ic("info")+'<div><b>Uygulama Hakkında</b><small>Jotun satış fırsatı puanlamasıyla seçilmiş yatırım ve ihale haberleri</small></div><span class="chev">'+ic("chev")+'</span></button></div>';
}
function viewArticle(){
  const i=get(S.article);if(!i)return "";const g=geo(i);
  return '<div class="ahero">'+scene(i.seg,i.id+"h")+'<div class="cap">'+tag(i)+(i.star?' <span class="tag" style="--c:#D97706">★ Bölgem</span>':'')+(i.kind?' <span class="tag" style="--c:#334155">'+KIND[i.kind]+'</span>':'')+'<h1>'+esc(i.title)+'</h1><div class="m">'+esc(i.source)+' · '+esc(rel(i.date))+'</div></div></div>'+
   (i.why?'<div class="why"><div class="h"><span>Jotun için neden fırsat</span><span>★ '+i.score+'/100</span></div><p class="co">'+esc(i.company||"")+'</p><p>'+esc(i.why)+'</p></div>':'')+
   '<p class="body">'+esc(i.summary)+'</p>'+
   '<div class="facts"><div><small>Segment</small><b>'+SEGN[i.seg]+'</b></div><div><small>Konum</small><b>'+(g?cap(g.name):(i.reg==="tr"?"Türkiye":"Global"))+'</b></div><div><small>Yayın</small><b>'+esc(i.date)+'</b></div><div><small>'+(i.deadline?"Son teklif":i.edate?"Hedef tarih":"Dil")+'</small><b>'+esc(i.deadline||i.edate||i.lang)+'</b></div></div>'+
   (i.also&&i.also.length?'<p class="also">Diğer kaynaklar: '+i.also.map(a=>'<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.source)+'</a>').join(" · ")+'</p>':'')+
   '<a class="btn" href="'+esc(i.url)+'" target="_blank" rel="noopener">Orijinal haberi oku '+ic("ext")+'</a>';
}
function render(){
  $("top").innerHTML=header();
  const v=S.view;
  $("main").innerHTML=v==="home"?viewHome():v==="sectors"?viewSectors():v==="projects"?viewProjects():v==="saved"?viewSaved():v==="profile"?viewProfile():v==="search"?viewSearch():viewArticle();
  const tab={article:S.prev,search:"home"}[v]||v;
  $("nav").innerHTML=[["home","Ana Sayfa","home"],["sectors","Sektörler","layers"],["projects","Projeler","brief"],["saved","Kaydedilenler","bm"],["profile","Profil","user"]].map(([k,l,n])=>'<button data-view="'+k+'"'+(tab===k?' aria-current="page"':'')+'>'+ic(n)+l+'</button>').join("");
  if(v==="search"){const q=$("q");q.addEventListener("input",doSearch);doSearch();q.focus()}
}
function doSearch(){const q=($("q").value||"").toLocaleLowerCase("tr");S.q=$("q").value;const r=q?ITEMS.filter(i=>(i.title+" "+(i.company||"")+" "+i.summary+" "+i.source).toLocaleLowerCase("tr").includes(q)):[];$("res").innerHTML=q?(r.length?r.sort(byScore).map(item).join(""):'<div class="empty">Sonuç yok.</div>'):''}
function go(v){if(v!=="article")S.article=null;S.view=v;render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-open],[data-view],[data-save],[data-seg],[data-slide],[data-back],[data-segview],[data-proj],[data-pin],[data-hide],[data-copy]");if(!el)return;const d=el.dataset;
  if(d.save){e.stopPropagation();S.saved=S.saved.includes(d.save)?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];store.set("saved",S.saved);render();return}
  if(d.open){if(S.view!=="article")S.prev=S.view;S.article=d.open;go("article");return}
  if(d.back){go(S.prev||"home");return}
  if(d.view){go(d.view);return}
  if(d.seg){S.seg=d.seg;S.slide=0;render();return}
  if(d.segview){S.seg=d.segview;S.slide=0;go("home");return}
  if(d.slide){S.slide=+d.slide;render();return}
  if(d.proj){S.proj=d.proj;S.pin=null;render();return}
  if(d.pin){S.pin=S.pin===d.pin?null:d.pin;render();return}
  if(d.hide){S.hidden=S.hidden.includes(d.hide)?S.hidden.filter(x=>x!==d.hide):[...S.hidden,d.hide];store.set("hidden",S.hidden);render();return}
  if(d.copy){try{navigator.clipboard.writeText(d.copy)}catch(_){};return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("[data-pin]")){e.preventDefault();e.target.closest("[data-pin]").dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
setInterval(()=>{if(S.view==="home"&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const n=document.querySelectorAll(".slide").length;if(n>1){S.slide=(S.slide+1)%n;document.querySelectorAll(".slide").forEach((s,k)=>{s.classList.toggle("on",k===S.slide);k===S.slide?s.removeAttribute("aria-hidden"):s.setAttribute("aria-hidden","true")});document.querySelectorAll(".dots button").forEach((b,k)=>b.setAttribute("aria-current",k===S.slide))}}},7000);
render();

(function(){
  const SUPA="https://qpwkiauhazpyaywjderc.supabase.co/rest/v1/",KEY="sb_publishable_eDv33WBVXDj1bmVkNS3Pxw_-4Cn_iPj";
  const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  fetch(SUPA+"news_items?select=id,seg,reg,lang,kind,star,title,summary,source,date,url,deadline,project,score,company,why&hidden=eq.false&score=gte."+MINSCORE+"&date=gte."+since+"&order=date.desc&limit=400",{headers:{apikey:KEY}}).then(r=>r.ok?r.json():[]).then(rows=>{
    const urls=new Set(ITEMS.map(i=>i.url));let n=0;
    for(const r of rows||[]){if(!r.url||urls.has(r.url)||!SEGS.includes(r.seg))continue;urls.add(r.url);ITEMS.push({id:r.id,seg:r.seg,reg:r.reg,lang:r.lang,kind:r.kind||null,star:!!r.star,score:+r.score,company:r.company||"",why:r.why||"",title:r.title,summary:r.summary||"",source:r.source,date:(r.date||"").slice(0,10),url:r.url,deadline:r.deadline||null,isNew:(Date.now()-Date.parse(r.date))<2*864e5});n++}
    if(n)render();
  }).catch(()=>{});
})();
</script>
